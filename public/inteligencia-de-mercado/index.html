<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inteligência do Mercado · Netanias Ferreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de membros, menu lateral fixo + área principal com rotas por hash; no celular o menu vira gaveta */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#ECEBE8; --line:#DCDAD5;
  --fg:#1E1E1E; --muted:#6B6863; --accent:#B8584B; --accent-fg:#FFFFFF; --accent-soft:#F3E2DE;
  --ok:#2F7D5B; --ok-soft:#DDEFE6;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292826; --line:#34322F;
  --fg:#EDEBE7; --muted:#A39F98; --accent:#D97A6B; --accent-fg:#1A1110; --accent-soft:#3A2522;
  --ok:#6CC59D; --ok-soft:#1E3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292826; --line:#34322F;
  --fg:#EDEBE7; --muted:#A39F98; --accent:#D97A6B; --accent-fg:#1A1110; --accent-soft:#3A2522;
  --ok:#6CC59D; --ok-soft:#1E3329; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:20px} h3{font-size:15px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* menu lateral */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.brand b{font-family:var(--font-display);font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:11px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .mono{color:var(--muted);padding:0 8px 6px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.nav a.on .count{color:var(--accent)}
.side-cta{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.side-cta p{font-size:12px}
.user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600}
/* principal */
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;text-decoration:none}
.pill.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.fav-on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.search{display:flex;gap:8px}
.search input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;min-width:0;width:220px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;white-space:nowrap}
.chip .n{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:4px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on .n{color:var(--bg);opacity:.7}
.filterbar{display:flex;flex-direction:column;gap:10px}
.showing{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:11px;color:var(--muted);gap:6px}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.tag.funil{background:var(--accent-soft);color:var(--accent)}
.tag.meu{background:var(--ok-soft);color:var(--ok)}
.thumb{aspect-ratio:4/5;position:relative;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:0;width:100%}
.play{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff;font-size:15px}
.card-body{padding:10px;display:grid;gap:8px}
.card-body h3{font-size:14px}
.metrics{display:flex;gap:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{padding:5px 9px;font-size:12px}
/* miniaturas desenhadas por formato */
.t-preta{background:#0E0E0E;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;text-align:center;padding:18px;line-height:1.15}
.t-notas{background:#FBF7E8;color:#222;align-content:start;justify-items:start;padding:16px;gap:6px;font-size:11px;text-align:left}
.t-notas b{font-size:14px;color:#111}
.t-notas i{font-style:normal;color:#C79A14;font-size:11px}
.t-zap{background:#E9DFD4;align-content:start;padding:14px;gap:6px;justify-items:stretch}
.bub{background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:#222;max-width:80%}
.bub.me{background:#D7F5C9;justify-self:end}
.t-verde{background:linear-gradient(#7A9BB8,#486A86);color:#fff}
.t-verde .face{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:62%;height:42%;background:#2A2522;border-radius:50% 50% 0 0}
.t-verde .shot{position:absolute;top:12%;left:12%;right:12%;height:38%;background:#fff;border-radius:6px;color:#222;font-size:11px;padding:8px;font-weight:600}
.t-div{grid-template-rows:1fr 1fr;place-items:stretch}
.t-div span:first-child{background:#3B4A5A}
.t-div span:last-child{background:#B9A58A}
.t-ad{grid-template-columns:1fr 1fr;place-items:stretch;font-size:11px;font-weight:700;color:#fff}
.t-ad span{display:grid;place-items:center}
.t-ad span:first-child{background:#6E6A66}
.t-ad span:last-child{background:#2F7D5B}
.t-noticia{background:#F1F1F1;align-content:start;padding:0}
.t-noticia .bar{background:#C0262D;color:#fff;font-weight:700;font-size:11px;padding:6px 10px;width:100%}
.t-noticia p{padding:10px;color:#111;font-family:Georgia,serif;font-size:14px;font-weight:700;text-align:left}
.t-post{background:#fff;align-content:start;justify-items:start;padding:14px;gap:8px;color:#111;text-align:left;font-size:12px}
.t-post .who{display:flex;gap:6px;align-items:center;font-weight:600}
.t-post .who i{width:20px;height:20px;border-radius:50%;background:#1D9BF0}
/* listas e páginas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:6px}
.row:first-child{border-top:0}
.row-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.row-head .num{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:24px;flex:none}
.row-head .t{flex:1;min-width:0}
.row-head .t b{display:block;font-family:var(--font-display);font-size:15px}
.open-box{display:grid;gap:10px;padding:6px 0 4px 36px}
.example{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px}
.prompt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;overflow-x:auto}
.prompt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.group-head{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.group-head .mono{color:var(--accent)}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.piece{padding:16px;display:grid;gap:8px;align-content:start}
.piece .mono{color:var(--accent)}
.funnel{display:grid;gap:8px;justify-items:center}
.lvl{border:0;color:var(--bg);background:var(--fg);padding:14px 10px;text-align:center;border-radius:6px;display:grid;gap:2px;transition:transform .15s}
.lvl:hover{transform:scale(1.01)}
.lvl b{font-family:var(--font-display);font-size:15px}
.lvl small{opacity:.75}
.hook{display:grid;gap:8px}
.hook-text{font-size:15px;line-height:1.6}
.slot{background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.src{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.adv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.adv .logo{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:16px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.video{aspect-ratio:16/9;background:linear-gradient(135deg,#2B2B2B,#4A3A36);border-radius:var(--r);display:grid;place-items:center;color:#fff;position:relative}
.lessons{display:grid;gap:8px;padding:14px}
.lesson{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.lesson.on{border-color:var(--accent);background:var(--accent-soft)}
.onb{display:grid;grid-template-columns:1fr 280px;gap:16px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form textarea,.form select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
details{border-top:1px solid var(--line);padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note-box{display:grid;gap:6px}
.note-box textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);padding:8px;font:inherit}
.impl{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.impl p{max-width:60ch;opacity:.85}
.impl .btn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.foot{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* janela */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:grid}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.modal .thumb{aspect-ratio:9/16;cursor:default}
.modal-foot{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}
.tx-modal{max-width:680px;overflow:hidden;grid-template-rows:auto minmax(0,1fr) auto}
.tx-modal .modal-head h2{font-size:16px}
.tx-body{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 10px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.tx-texto{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.6;background:var(--surface-2);padding:12px;border-radius:8px;margin:0;overflow-wrap:anywhere}
.tx-modal .modal-foot{border-top:1px solid var(--line)}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60}
.proto{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:6px 10px}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:max(20px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .onb{grid-template-columns:1fr}
  .search input{width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .open-box{padding-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Paleta nova (sales dashboard laranja/âmbar), substitui a do protótipo; layout igual */
:root,:root[data-theme="light"]{--bg:#F4F4F2;--surface:#FFFFFF;--surface-2:#F4F4F2;--line:#ECECEC;--fg:#111111;--muted:#6B6B6B;
 --accent:#F7931E;--accent-txt:#C2410C;--accent-fg:#111111;--accent-soft:#FFEDD5;--amber:#FDB022;--yellow:#FFC83D;
 --ok:#15803D;--ok-soft:#DCFCE7;--bad:#DC2626;--blue:#1D4ED8;--blue-soft:#DBEAFE;--r:18px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
 --font-display:"Inter",system-ui,sans-serif;--side-bg:#161616;--side-fg:#FFFFFF;--side-muted:#9A9A9A;--side-on:#2A2A2A;color-scheme:light}
:root[data-theme="dark"]{--bg:#1A1A1A;--surface:#222222;--surface-2:#2A2A2A;--line:#333333;--fg:#F5F5F5;--muted:#A3A3A3;--accent:#F7931E;--accent-fg:#111111;--accent-txt:#FDB022;--accent-soft:#3A2A16;--ok:#4ADE80;--ok-soft:#14321F;--blue:#93C5FD;--blue-soft:#1E2A44;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1A1A;--surface:#222222;--surface-2:#2A2A2A;--line:#333333;--fg:#F5F5F5;--muted:#A3A3A3;--accent:#F7931E;--accent-fg:#111111;--accent-txt:#FDB022;--accent-soft:#3A2A16;--ok:#4ADE80;--ok-soft:#14321F;--blue:#93C5FD;--blue-soft:#1E2A44;color-scheme:dark}}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
.side{background:var(--side-bg);color:var(--side-fg);border-right:0}
.side .brand small,.side .nav-group .mono,.side .user,.side .nav .count{color:var(--side-muted)}
.side .nav a{color:var(--side-fg)} .side .nav a:hover{background:#222}
.side .nav a.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent)} .side .nav a.on .count{color:var(--accent)}
.brand-mark{background:linear-gradient(135deg,var(--accent),var(--amber));color:#111}
.side-cta{background:#1F1F1F;border-color:#2E2E2E;color:#fff}
.side-cta .btn.primary{background:var(--yellow);color:#111;border-color:var(--yellow);font-weight:600}
.side .btn{background:#222;border-color:#333;color:#fff} .avatar{background:var(--accent);color:#111}
.panel,.card{border-radius:var(--r);box-shadow:var(--shadow);border-color:var(--line)}
.btn{border-radius:999px} .btn.primary{background:#111;color:#fff;border-color:#111}
:root[data-theme="dark"] .main .btn.primary{background:#F5F5F5;color:#111;border-color:#F5F5F5}
.btn.fav-on{color:var(--accent-txt);border-color:var(--accent)} .tag.funil{color:var(--accent-txt)}
.mono{color:var(--accent-txt)} .muted.mono,.mono.muted{color:var(--muted)}
select.f{border-radius:999px} .chip.on{background:#111;color:#fff}
.stat{background:var(--surface)} .stats .stat:first-child{background:#1C1C1C;color:#fff;border-color:#1C1C1C}
.stats .stat:first-child .muted{color:#BDBDBD}
.stats .stat:first-child::after{content:"";display:block;height:6px;margin-top:12px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--amber))}
.stat b{font-size:36px;font-weight:800}
.impl{background:#1C1C1C;color:#fff;border-radius:var(--r)} .impl .btn{background:var(--yellow);color:#111;border-color:var(--yellow)}
.status.respondido{background:var(--ok-soft);color:var(--ok)} .status{background:var(--blue-soft);color:var(--blue)}
.example{border-left-color:var(--accent)} :focus-visible{outline-color:var(--accent)}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}} .main{min-width:0;overflow-x:hidden}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .panel{max-width:400px;width:100%;padding:28px;display:grid;gap:14px}
.media{width:100%;max-height:70vh;background:#000;display:block;object-fit:contain;border-radius:8px}
.fmt-card{padding:16px;display:grid;gap:8px;align-content:start;text-decoration:none}
.fmt-card:hover{border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{padding:16px}.stat-link{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}.stat-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.stat-ir{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--accent)}.stats .stat:first-child .stat-ir{color:var(--amber)}.stat b{font-family:var(--font-display);font-size:30px;display:block}
.ex{padding:14px;display:grid;gap:10px;align-content:start}
.ex pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;background:var(--surface-2);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.ex details{padding:0;border:0}
.status{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);white-space:nowrap}

const NIVEIS = {"intro": "Cada pessoa chega no anúncio sabendo uma coisa diferente sobre o próprio problema e sobre a sua oferta. Se o anúncio começa num ponto que ela ainda não alcançou, ela não entende. Se começa num ponto que ela já passou, ela se entedia. O nível de consciência diz onde a conversa deve começar.", "regra_ouro": "Comece o anúncio exatamente onde está a cabeça do seu público, nunca onde está a sua.", "niveis": [{"nivel": "inconsciente", "titulo": "Não sabe que tem um problema", "o_que_e": "A pessoa vive o problema, mas ainda não deu nome a ele. Para ela, aquilo é normal ou é só o jeito que a vida é.", "como_falar": "Abra pela identidade dela ou por uma cena que ela reconhece, nunca pelo produto. Entregue uma verdade incômoda que faça ela se ver no espelho. No high ticket, esse anúncio filtra pelo jeito de pensar, não vende.", "erro_comum": "Falar do método, do preço ou da oferta para quem nem sabe que precisa de ajuda.", "etapa_funil": "topo", "exemplos": ["Para qualquer pessoa com o mínimo de educação financeira, a poupança não é uma opção.", "100 dias sem redes sociais. A lição número 1 que aprendi você não vai gostar de ouvir.", "Quando você vai arrumar um trabalho de verdade? Eu: no meu trabalho de verdade."]}, {"nivel": "consciente do problema", "titulo": "Sente a dor, não sabe a saída", "o_que_e": "A pessoa sabe que algo está errado e sente isso no bolso ou na rotina. Ela ainda não sabe que existe um jeito de resolver.", "como_falar": "Abra pela dor dela, com as palavras que ela usa, em cena concreta. Mostre que você entende o problema melhor do que ela e só então aponte que existe uma saída. No high ticket, deixe claro o custo de continuar como está.", "erro_comum": "Pular direto para a solução sem antes provar que entende a dor.", "etapa_funil": "topo", "exemplos": ["Meu perfil parece abandonado. Mas já vendeu mais de R$300 mil em serviços.", "O \"vou pensar\" depois da call é falta de preparo do lead.", "Atender 7 horas por dia pra mal conseguir pagar as contas do mês não é liberdade, é sobreviver."]}, {"nivel": "consciente da solução", "titulo": "Sabe o que quer, não conhece você", "o_que_e": "A pessoa já sabe o resultado que deseja e que existe um caminho para chegar lá. Ela só não sabe que a sua oferta entrega isso.", "como_falar": "Abra pelo resultado que ela quer, dito de forma concreta e com número. Depois mostre por que o seu caminho chega lá melhor que os outros, com mecanismo e prova. No high ticket, a prova de casos parecidos com o dela pesa mais que a promessa.", "erro_comum": "Gastar tempo explicando o problema para quem já está procurando a solução.", "etapa_funil": "meio", "exemplos": ["Isso é o que acontece com o corpo de quem faz treino híbrido.", "Quer achar oferta de low ticket? Escreve isso aqui na biblioteca de anúncios.", "Para vender serviços e mentorias de R$5 mil a R$10 mil para pessoas que ainda não conhecem você."]}, {"nivel": "consciente do produto", "titulo": "Conhece você, ainda não decidiu", "o_que_e": "A pessoa já sabe o que você vende e o que a oferta faz. Ela ainda tem dúvida se funciona para ela ou se vale o preço.", "como_falar": "Abra pelo produto e pelo que ele já fez por gente como ela. Entregue prova, detalhes da entrega e resposta para as objeções que travam a decisão. No high ticket, mostre o passo a passo de como é trabalhar com você.", "erro_comum": "Repetir a apresentação genérica em vez de matar a dúvida que impede a compra.", "etapa_funil": "meio", "exemplos": ["Falaram que esse treino não funciona, mas eu testei por 7 dias.", "Vou te mostrar algo que todo eletricista residencial deveria ter.", "Vender 1 mentoria por semana sem abrir turma: anúncio que atrai, aplicação que filtra, sessão que fecha."]}, {"nivel": "totalmente consciente", "titulo": "Já quer, só precisa do empurrão", "o_que_e": "A pessoa conhece a oferta, confia e já quer comprar. Falta só um motivo para agir agora.", "como_falar": "Abra direto pela oferta, condição e prazo. Entregue o que muda hoje: bônus, vaga, condição especial ou fim do prazo. No high ticket, a urgência vem de vaga limitada e agenda real, nunca de desconto inventado.", "erro_comum": "Voltar a explicar o problema e o método para quem só está esperando o convite.", "etapa_funil": "fundo", "exemplos": ["Atenção. Última chance da promoção de feriadão com 40% de desconto.", "A pedidos, estendemos a nossa maior oferta de todos os tempos.", "Apenas hoje está liberado o lote antecipado no menor preço."]}]};
const FICHAS_HT = {"intro":"Formato não é enfeite, é ferramenta: cada um existe para cumprir uma tarefa dentro do funil. Antes de pensar em como gravar, decida o que aquele conteúdo precisa provocar em quem assiste. Com a função clara, o formato certo aparece sozinho e a dúvida de como gravar deixa de travar a produção.","rotacao":"Ninguém precisa usar os 18 formatos: escolha de 4 a 6 que você domina, gire entre eles e coloque um novo em teste por mês, puxando daqui quando algum cansar. Para quem vende mentoria, consultoria ou serviço de alto valor, uma divisão que funciona é cerca de metade do volume no topo, um terço no meio e o restante no fundo. Se o perfil cresce mas ninguém compra, está faltando meio; se nem cresce, está faltando topo.","etapas":[{"etapa":"Topo","titulo":"Chamar atenção","objetivos":[{"objetivo":"Aproveitar um assunto que já está em alta","formatos":["Tela Verde","Twitter Padrão"]},{"objetivo":"Tomar posição contra uma ideia do mercado","formatos":["Opinião","React","Ranking ou Tier List"]},{"objetivo":"Segurar o olhar pela curiosidade","formatos":["Storytelling","B-Roll"]}],"fichas":[{"nome":"Tela Verde","familia":"Vídeo","esforco":"Baixo","o_que_e":"A notícia, o print ou o post fica de fundo e você aparece na frente dando a sua leitura sobre aquilo.","use_quando":"O seu mercado está falando de um assunto e você enxerga um lado que nenhum concorrente está mostrando, algo que conversa com a dor do cliente que compra o seu serviço.","nao_use_quando":"O tema ainda não pegou. Esse formato só aproveita uma conversa que já existe, ele não fabrica interesse do zero.","como_executar":["Separe uma imagem de fundo que já diga o essencial sozinha: manchete, print ou publicação.","Grave com fundo verde ou use o recurso de trocar o fundo do próprio aplicativo de edição.","Entre direto reagindo ao que está atrás de você, sem dizer seu nome nem o que você faz.","Termine com a sua conclusão sobre o caso, nunca repetindo o que a notícia já disse."],"erro_comum":"Ler em voz alta o que está na tela. Se a pessoa consegue ler sozinha, a sua voz virou ruído; o valor está na opinião que só você tem.","vizinhos":["React","Twitter Padrão","Storytelling"],"formatos_catalogo":["Tela Verde"]},{"nome":"React","familia":"Vídeo","esforco":"Baixo","o_que_e":"O vídeo de outra pessoa roda na tela e você comenta a fala dela em cima.","use_quando":"Alguém que o seu público ouve disse algo que você contesta, ou que você concorda e consegue levar mais fundo, mostrando como um especialista de alto valor pensa diferente.","nao_use_quando":"Você não tem uma tese própria para somar. Sem opinião, você só empresta palco e audiência para o outro.","como_executar":["Recorte um trecho curto, de até 15 segundos, que se sustente sem explicação.","Deixe esse trecho tocar antes de você aparecer, para a pessoa entender o contexto.","Congele a imagem no exato momento da frase que você vai rebater ou aprofundar.","Diga a sua posição numa frase só e só depois explique o porquê."],"erro_comum":"Deixar o vídeo alheio ocupar o conteúdo. Quando metade do tempo é a fala do outro, quem sai com autoridade é ele, não você.","vizinhos":["Tela Verde","Caixinha de Perguntas"],"formatos_catalogo":["React"]},{"nome":"Ranking ou Tier List","familia":"Vídeo","esforco":"Médio","o_que_e":"Você coloca em ordem ou em faixas itens que o seu mercado já conhece, normalmente numa tabela visual.","use_quando":"O público já tem opinião sobre aquilo que você vai classificar (ferramentas, estratégias, tipos de oferta) e a discordância vai gerar comentário.","nao_use_quando":"As pessoas não conhecem os itens. Classificar o desconhecido não provoca reação, só deixa todo mundo perdido.","como_executar":["Monte a tabela antes de gravar e mantenha ela visível do começo ao fim.","Comece pelo item em que quase todo mundo concorda, para a pessoa entender a régua.","Inclua de propósito pelo menos uma posição que vai dividir opiniões.","Explique cada lugar com uma frase curta, porque justificativa longa mata o ritmo."],"erro_comum":"Classificar sem dizer o critério. Sem saber o que está sendo medido, quem discorda deixa de debater e passa a desconfiar de você.","vizinhos":["Comparativo","Framework","Storytelling"],"formatos_catalogo":["Tier list","Top 5 (ranking)"]},{"nome":"Storytelling","familia":"Vídeo","esforco":"Médio","o_que_e":"A ideia chega embrulhada num acontecimento: primeiro a pessoa é fisgada pela história, depois recebe a lição.","use_quando":"Você viveu ou acompanhou um caso com tensão e final claro, e a lição só fica forte depois que a pessoa sente o que estava em jogo.","nao_use_quando":"Não existe conflito no que você vai contar. Sem tensão, é só um relato, e relato não segura ninguém.","como_executar":["Entre no ponto mais tenso da história, nunca no começo da linha do tempo.","Deixe claro o que podia ser perdido antes de narrar o que aconteceu.","Guarde o desfecho para o último terço do vídeo.","Feche com a lição numa frase só, porque a história já fez o trabalho pesado."],"erro_comum":"Anunciar que vai contar uma história. Avisar que vem uma história tira a surpresa e quebra o efeito antes de ele começar.","vizinhos":["Estudo de caso (análise)","B-Roll","Falando com a Câmera"],"formatos_catalogo":["Storytelling (vídeo)"]},{"nome":"B-Roll","familia":"Vídeo","esforco":"Médio","o_que_e":"Imagens de apoio passam na tela enquanto a sua narração ou um texto escrito carrega a mensagem.","use_quando":"A ideia é forte no papel ou no áudio, você não tem como gravar falando agora e tem imagens suas que combinam com o que está sendo dito.","nao_use_quando":"Falta mensagem forte ou história boa por trás. Imagem bonita sem conteúdo espalha a atenção em vez de prender.","como_executar":["Escreva ou grave a narração antes de pensar nas imagens.","Escolha cenas que mostrem exatamente o que a fala está dizendo.","Com narração, troque de imagem a cada 2 ou 3 segundos; com texto na tela, segure a mesma cena por uns 10 segundos.","Coloque a frase mais forte logo no primeiro segundo, para a imagem não parecer só decoração."],"erro_comum":"Usar imagem de banco genérica. Para quem vende serviço caro, foto de estoque denuncia que você não tem material próprio para mostrar.","vizinhos":["Storytelling","Bastidores","Estudo de caso (análise)"],"formatos_catalogo":["Narrado"]},{"nome":"Twitter Padrão","familia":"Estático","esforco":"Baixo","o_que_e":"A imagem de uma publicação curta em texto, postada do jeito que ela é.","use_quando":"A frase já existe, já repercutiu, e publicar rápido rende mais do que caprichar na arte.","nao_use_quando":"A imagem está ruim ou a frase é sua e nunca teve alcance. Captura malfeita passa sensação de improviso, e improviso não combina com ticket alto.","como_executar":["Tire a captura em boa resolução e no modo claro.","Corte o enquadramento para esconder os números de interação quando eles forem baixos.","Escreva uma legenda que desenvolva a ideia, porque a imagem sozinha não constrói autoridade.","Quando o tema pedir mais, use a imagem como primeira tela de um carrossel maior."],"erro_comum":"Postar uma frase com pouquíssimas curtidas visíveis. O número baixo vira prova contra você.","vizinhos":["Carrossel Edu","Carrossel Fotos + Texto Nativo","Tela Verde"],"formatos_catalogo":["Estilo Twitter (X)","Tweet"]},{"nome":"Opinião","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você defende uma posição pessoal, forte e verdadeira sobre algo que ama ou odeia: no mercado, no trabalho, nos clientes, na cultura, na fé ou na família. Não é dica nem tutorial, é a sua visão de mundo.","use_quando":"Você quer se posicionar e atrair quem pensa igual. O comprador de alto valor já tem informação, tem IA e tem acesso a tudo; o que ele não encontra em lugar nenhum é a sua leitura do mundo. Marca com opinião tem alma, e alma vira tribo.","nao_use_quando":"A opinião não é sua de verdade ou foi escolhida só para causar. Opinião fabricada é percebida rápido e destrói a confiança que o formato deveria construir.","como_executar":["Escolha algo que você realmente ama ou odeia e que toca a vida ou o negócio do seu público.","Abra pela posição, em uma frase curta e sem rodeio, antes de qualquer explicação.","Sustente com um motivo vivido: uma cena, um caso ou um número que só você tem.","Feche convocando quem pensa igual, e aceite que quem discorda vai reagir."],"erro_comum":"Ficar em cima do muro para agradar todo mundo. Opinião morna não cria tribo nem cria hater, e sem os dois o conteúdo some.","vizinhos":["React","Falando com a Câmera","Storytelling"],"formatos_catalogo":["Opinião"],"como_pensar":{"intro":"Antes de gravar, responda estas perguntas. Opinião forte nasce do que você ama ou odeia de verdade, não do que parece bom falar.","perguntas":["O que existe no seu mercado que, quando você ouve ou vê, te deixa indignado?","O que você ama tanto fazer no seu trabalho que, se pudesse, faria até de graça?","O que você ama no dia a dia da sua empresa, da sua família ou da sua rotina, e defende sem pensar duas vezes?","Do que você não abre mão na sua vida, no seu trabalho e na sua integridade, mesmo que isso custe cliente ou dinheiro?","Qual crença sua faria muita gente estranhar se você dissesse em público?"],"fecho":"A resposta que mais te dá frio na barriga de falar é a sua melhor opinião. É ela que separa quem vira tribo de quem vira hater, e é isso que constrói uma marca pessoal forte."}}]},{"etapa":"Meio","titulo":"Gerar autoridade","objetivos":[{"objetivo":"Ensinar um conceito","formatos":["Tela Dividida","Quadro Branco","Framework"]},{"objetivo":"Mostrar como você pensa","formatos":["Estudo de caso (análise)","Comparativo"]},{"objetivo":"Organizar a informação","formatos":["Comparativo","Framework","Carrossel Edu"]}],"fichas":[{"nome":"Tela Dividida","familia":"Vídeo","esforco":"Baixo","o_que_e":"A tela fica em duas partes: o material que você está explicando de um lado e você do outro, em geral o material em cima e você embaixo.","use_quando":"Para entender o que você ensina, a pessoa precisa ver e ouvir ao mesmo tempo, como um número, um gráfico ou uma página analisada.","nao_use_quando":"O material não acrescenta nada. Dividir a tela só para preencher espaço diminui você sem ganho nenhum.","como_executar":["Grave a sua parte olhando para a lente, não para o material.","Faça o que aparece na metade de cima acompanhar exatamente o que você está falando.","Mantenha o tamanho das duas partes fixo do início ao fim, para não confundir.","No final, volte para a tela inteira em você e entregue a sua conclusão."],"erro_comum":"Deixar o material fora do tempo da fala. Imagem adiantada ou atrasada cansa em poucos segundos.","vizinhos":["Quadro Branco","Comparativo","Carrossel Edu"],"formatos_catalogo":["Tela Dividida"]},{"nome":"Estudo de caso (análise)","familia":"Vídeo","esforco":"Médio","o_que_e":"Você desmonta um caso real, de outra empresa ou do mercado, e mostra como você interpreta o problema.","use_quando":"O objetivo é provar raciocínio. O que importa não é o resultado do caso, e sim o caminho que você faz para chegar até ele, que é o que o cliente de alto valor compra.","nao_use_quando":"Você sabe pouco sobre o caso. Análise em cima de achismo cai no primeiro comentário de quem conhece o assunto.","como_executar":["Escolha um caso que o público conhece e olhe por um ângulo que ninguém está explorando.","Apresente os fatos antes da opinião, separando com clareza o que é dado do que é interpretação sua.","Mostre as etapas do seu raciocínio, não apenas a resposta final.","Termine tirando um princípio que a pessoa possa aplicar no negócio dela."],"erro_comum":"Narrar o caso e parar. Sem a lição extraída, o vídeo vira notícia e não análise.","vizinhos":["Comparativo","Storytelling","Estudo de caso (cliente real)"],"formatos_catalogo":["Análise"]},{"nome":"Quadro Branco","familia":"Vídeo","esforco":"Médio","o_que_e":"Você explica desenhando ao vivo num quadro, montando a ideia diante de quem assiste.","use_quando":"O conceito tem partes que se conectam, como etapas, relações ou níveis, e fica mais claro sendo construído do que sendo só falado.","nao_use_quando":"A ideia é simples e em linha reta. Desenhar o óbvio só deixa o vídeo arrastado.","como_executar":["Planeje o desenho antes de ligar a câmera, porque improvisar no quadro vira rabisco.","Comece com o quadro limpo: ver a ideia nascendo é o que segura a atenção.","Fale enquanto escreve, nunca escreva primeiro e explique depois.","Termine com o quadro completo em plano fechado, para a pessoa salvar a imagem."],"erro_comum":"Escrever com letra pequena. O conteúdo é visto no celular, e o que não dá para ler na tela pequena não existe.","vizinhos":["Framework","Tela Dividida","Carrossel Edu"],"formatos_catalogo":["Quadro Branco"]},{"nome":"Framework","familia":"Vídeo","esforco":"Médio","o_que_e":"Você batiza o seu próprio método e ensina as etapas dele em ordem.","use_quando":"Você já aplica um processo com os clientes e quer transformá-lo em algo que diferencia a sua mentoria ou consultoria no mercado.","nao_use_quando":"O método é o mesmo de todo mundo com outro nome. Rebatizar o óbvio é percebido rápido e tira credibilidade.","como_executar":["Crie um nome curto e fácil de falar: se o público não repete, não pegou.","Limite de 3 a 5 etapas, porque mais do que isso ninguém guarda.","Deixe o desenho do método visível na tela desde o primeiro segundo.","Mostre o método funcionando num caso concreto dentro do mesmo vídeo."],"erro_comum":"Inventar o método só para ter o que postar. Método que nasceu no roteiro, e não na prática, não aguenta a primeira pergunta difícil.","vizinhos":["Quadro Branco","Carrossel Edu","Estudo de caso (análise)"],"formatos_catalogo":["Framework (método com nome)","Diagrama"]},{"nome":"Comparativo","familia":"Vídeo","esforco":"Médio","o_que_e":"Duas alternativas lado a lado, medidas pela mesma régua, com uma escolha no final.","use_quando":"O seu público está dividido entre caminhos concretos (contratar, fazer sozinho, outro modelo) e ninguém compara com sinceridade.","nao_use_quando":"Você ganha com um dos lados e não vai assumir isso. Comparação puxada para um lado destrói a autoridade assim que alguém percebe.","como_executar":["Diga quais critérios vai usar antes de começar a comparar.","Passe pelos mesmos critérios nos dois lados, na mesma sequência.","Admita pelo menos uma vantagem real da opção que você não vai recomendar.","Termine com a sua escolha e diga em que situação ela mudaria."],"erro_comum":"Comparar e não escolher. A pessoa veio para resolver a dúvida, e um empate não responde nada.","vizinhos":["Ranking ou Tier List","Estudo de caso (análise)","Tela Dividida"],"formatos_catalogo":["Comparação"]},{"nome":"Carrossel Edu","familia":"Estático","esforco":"Médio","o_que_e":"Uma aula em sequência de telas, com capa forte e a ideia avançando passo a passo.","use_quando":"O conteúdo tem etapas e a pessoa precisa ir no ritmo dela, voltando quando quiser.","nao_use_quando":"A ideia cabe numa imagem só. Carrossel esticado à força é abandonado lá pela terceira tela.","como_executar":["Coloque a maior parte da energia na capa, porque é ela que decide se o resto será visto.","Uma ideia por tela, sem exceção.","Amarre as telas: o fim de uma deve dar vontade de ver a próxima.","Feche com uma tela de resumo que valha a pena salvar sozinha."],"erro_comum":"Conteúdo ótimo com capa fraca. Se a primeira tela não interrompe a rolagem, o resto nunca é visto.","vizinhos":["Framework","Quadro Branco","Carrossel Fotos + Texto Nativo"],"formatos_catalogo":["Carrossel educativo"]}]},{"etapa":"Fundo","titulo":"Gerar confiança","objetivos":[{"objetivo":"Derrubar uma objeção","formatos":["Caixinha de Perguntas","Falando com a Câmera"]},{"objetivo":"Mostrar quem você é por dentro","formatos":["Bastidores","No Carro"]},{"objetivo":"Provar resultado","formatos":["Estudo de caso (cliente real)","Carrossel Fotos + Texto Nativo"]}],"fichas":[{"nome":"Caixinha de Perguntas","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você responde uma pergunta enviada por alguém da audiência, com a pergunta aparecendo na tela.","use_quando":"É uma dúvida que surge sempre antes de alguém fechar com você e que você já respondeu muitas vezes nas conversas de venda.","nao_use_quando":"A pergunta é agressiva ou pessoal demais. Responder em público constrange quem mandou e faz os outros pararem de perguntar.","como_executar":["Escolha perguntas que falem por muita gente, não pelo caso de uma pessoa só.","Mantenha a pergunta visível durante o vídeo inteiro.","Responda exatamente o que foi perguntado antes de abrir para o assunto maior.","Feche chamando novas perguntas, porque o formato vive delas."],"erro_comum":"Escolher só perguntas fáceis. A audiência percebe que as difíceis ficam sem resposta e a confiança cai.","vizinhos":["Falando com a Câmera","Estudo de caso (cliente real)","React"],"formatos_catalogo":["Caixinha","Caixa de perguntas"]},{"nome":"Falando com a Câmera","familia":"Vídeo","esforco":"Baixo","o_que_e":"Só você olhando para a lente, sem imagem de apoio e sem efeito. O jeito mais direto de falar com alguém.","use_quando":"O assunto pede a sua presença: assumir uma posição, dar um recado ou quebrar uma objeção que só tem peso se vier de você.","nao_use_quando":"O conteúdo depende de algo para mostrar. Explicação técnica sem apoio visual não para em pé.","como_executar":["Enquadre de meio corpo para perto, com os olhos no terço de cima da tela.","Comece pela afirmação mais forte, nunca por quem você é.","Fale como se fosse com uma pessoa só, não com uma plateia.","Coloque legenda, porque o formato depende de retenção e muita gente assiste sem som."],"erro_comum":"Ler o roteiro. O olhar desviando para o texto apaga justamente a conexão que o formato tem de melhor.","vizinhos":["Caixinha de Perguntas","No Carro","Storytelling"],"formatos_catalogo":["LO-FI","O dono falando"]},{"nome":"Estudo de caso (cliente real)","familia":"Vídeo","esforco":"Médio","o_que_e":"A mesma lógica da análise, mas com um caso seu: cliente real, situação real e resultado real.","use_quando":"O cliente autorizou a exposição e o resultado pode ser conferido.","nao_use_quando":"Faltam números ou falta permissão. Caso sem prova soa como promessa, e promessa na hora da compra aumenta a desconfiança.","como_executar":["Peça autorização por escrito antes de gravar.","Comece pelo ponto de partida: onde o cliente estava e o que estava doendo.","Mostre a decisão que você tomou e o motivo dela, porque é o seu julgamento que se vende, não só o resultado.","Apresente o resultado com número e com o tempo que levou."],"erro_comum":"Contar o caso como se fosse anúncio. O que convence é o raciocínio por trás da decisão; o resultado só confirma.","vizinhos":["Bastidores","Comparativo","Estudo de caso (análise)"],"formatos_catalogo":["Estudo de caso (cliente real)","Depoimento"]},{"nome":"Bastidores","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você abre a porta do processo e mostra como o trabalho acontece antes de o resultado aparecer.","use_quando":"O que te diferencia está no jeito de fazer e esse jeito não aparece de fora, como a preparação de uma sessão ou a análise de um cliente.","nao_use_quando":"O bastidor está bagunçado ou expõe um cliente. Aí a transparência vira risco.","como_executar":["Escolha a parte do processo que o cliente nunca chega a ver.","Grave do jeito que está, sem produzir demais, porque bastidor arrumado perde a verdade.","Diga o que está acontecendo, porque sem explicação é só uma cena bonita.","Ligue o que aparece ao resultado que aquilo gera para o cliente."],"erro_comum":"Mostrar um processo igual ao de todo mundo. Se qualquer concorrente faz igual, você provou que é parecido, não que é melhor.","vizinhos":["No Carro","B-Roll","Falando com a Câmera"],"formatos_catalogo":["Bastidores"]},{"nome":"No Carro","familia":"Vídeo","esforco":"Baixo","o_que_e":"Uma conversa gravada dentro do carro, aproveitando o clima informal e próximo que esse lugar cria.","use_quando":"Você quer passar uma reflexão com cara de conversa particular, longe da formalidade de um cenário montado.","nao_use_quando":"O carro está em movimento com você no volante. Além do perigo, a atenção dividida aparece na fala.","como_executar":["Grave com o carro parado, sempre.","Use microfone de lapela, porque o som dentro do carro ecoa.","Prenda o celular no painel, um pouco acima da altura dos olhos.","Fale como numa conversa, não como numa aula: o formato depende de soar natural."],"erro_comum":"Gravar dirigindo. O ganho de movimento não paga o risco nem a piora do áudio.","vizinhos":["Falando com a Câmera","Bastidores","Caixinha de Perguntas"],"formatos_catalogo":["Conversa no Carro"]},{"nome":"Carrossel Fotos + Texto Nativo","familia":"Estático","esforco":"Baixo","o_que_e":"Fotos reais do seu trabalho com texto simples, no estilo nativo da rede.","use_quando":"Você tem fotos verdadeiras de entrega, encontro ou cliente, e o texto explica o que cada foto comprova.","nao_use_quando":"As fotos são genéricas. O formato só funciona quando a imagem é prova, não ilustração.","como_executar":["Escolha fotos com gente e com lugar que dê para reconhecer.","Comece pelo texto que dá sentido à foto, nunca pela foto solta.","Use letra discreta e deixe a foto ser a estrela.","Feche com uma tela de texto que transforme a prova num convite para conversar com você."],"erro_comum":"Postar as fotos sem texto. Sem contexto, parece álbum pessoal e não gera confiança para comprar.","vizinhos":["Carrossel Edu","Bastidores","Twitter Padrão"],"formatos_catalogo":["Nativo"]}]}]};
const COMO_USAR_ANGULOS = "Toda campanha escolhe 1 tema de mercado e mantém esse tema fixo do começo ao fim, porque ele é o tom da conversa com o público. Dentro do mesmo tema, o ângulo emocional pode variar de peça para peça, conforme a etapa do funil e o momento do cliente. O tipo de resposta direta define a estrutura do anúncio e deve casar com o nível de consciência do público. A peça forte combina os 3: tema fixo, um ângulo emocional por peça e o tipo de resposta direta certo para quem vai ler. O ângulo tático define onde o criativo aponta a lupa (problema, solução, produto, oferta ou formato); use 1 ou 2 por peça. Para oferta high ticket, comece pelo grupo High Ticket.";

const FUNIS = {"intro":"Funil de monetização é o caminho que o lead percorre depois que entra na sua base ou compra de você: por onde ele chega, quem fala com ele, em qual canal e o que acontece em cada sim e em cada não. Aqui estão os 7 funis que usamos na prática, cada um com o desenho do fluxo, o que você precisa ter antes e o passo a passo para colocar no ar. Nenhum lead termina em \"não comprou\" sem destino.","como_escolher":"Escolha pelo ticket da oferta que você quer vender. Até R$497, leve o lead direto para a página de vendas, com ou sem vídeo. De R$498 a R$3.000, use webinário ou desafio e coloque o comercial na recuperação; acima de R$3.000, o webinário ou o desafio servem para gerar consciência e o comercial vira o motor principal, com conversa de diagnóstico.","funis":[{"numero":1,"nome":"Funil de Upsell e Downsell","objetivo":"Aumentar o valor de cada comprador oferecendo o próximo passo logo depois da compra e uma saída mais barata para quem recusar.","para_quem":"Qualquer ticket. Serve para quem vende produto de entrada até R$497 com tráfego pago e para quem já vende serviço, mentoria ou consultoria e perde venda porque parte do público não consegue pagar.","duracao":"Começa na hora da compra; de 3 a 7 dias para percorrer todas as ofertas","mermaid":"flowchart LR\n  A[\"Comprou produto de aquisição\"]:::origem --> U1[\"Upsell 1\"]:::acao\n  CN[\"WhatsApp e e-mails\"]:::canal -.-> U1\n  U1 --> D1{\"Comprou?\"}:::decisao\n  D1 -->|Sim| U2[\"Upsell 2\"]:::acao\n  D1 -->|\"Não\"| DS1[\"Downsell 1\"]:::acao\n  DS1 --> D2{\"Comprou?\"}:::decisao\n  D2 -->|Sim| U2\n  D2 -->|\"Não\"| DS2[\"Downsell 2\"]:::acao\n  DS2 --> D3{\"Comprou?\"}:::decisao\n  D3 -->|Sim| U2\n  D3 -->|\"Não\"| F1[\"Fim do fluxo\"]:::fim\n  U2 --> D4{\"Comprou?\"}:::decisao\n  D4 -->|Sim| F2[\"Fim do fluxo\"]:::fim\n  D4 -->|\"Não\"| DU1[\"Downsell 1 do Upsell 2\"]:::acao\n  DU1 --> D5{\"Comprou?\"}:::decisao\n  D5 -->|Sim| F2\n  D5 -->|\"Não\"| DU2[\"Downsell 2 do Upsell 2\"]:::acao\n  DU2 --> D6{\"Comprou?\"}:::decisao\n  D6 -->|\"Sim ou não\"| F2\n  classDef origem fill:#DBEAFE,stroke:#1D4ED8;\n  classDef acao fill:#F4F4F2,stroke:#6B6B6B;\n  classDef canal fill:#EDE9FE,stroke:#6D28D9;\n  classDef decisao fill:#FCE7F3,stroke:#BE185D;\n  classDef checkout fill:#DCFCE7,stroke:#15803D;\n  classDef fim fill:#FEF3C7,stroke:#B45309;\n  classDef perdido fill:#FEE2E2,stroke:#B91C1C;","precisa_ter":["Um produto de aquisição que já vende (a porta de entrada)","2 upsells definidos, cada um continuando o resultado do anterior","2 downsells para cada upsell (4 no total), mais baratos ou menores","Checkout com link direto para cada oferta (de preferência compra em 1 clique)","Integração da plataforma de pagamento com a automação, para saber quem comprou o quê","WhatsApp e ferramenta de e-mail com automação por evento de compra"],"passo_a_passo":["Defina o produto de aquisição e liste o que o comprador precisa logo depois dele para ter o resultado mais rápido.","Monte o Upsell 1 como o próximo passo natural do que a pessoa acabou de comprar.","Monte o Downsell 1 e o Downsell 2 do Upsell 1: versão menor, só uma parte ou condição mais leve, mais barata a cada degrau.","Monte o Upsell 2 e os 2 downsells dele com a mesma lógica.","Configure a automação: a compra do produto de aquisição dispara o Upsell 1 na página de obrigado, no WhatsApp e no e-mail.","Crie a regra do Upsell 1: comprou, vai para o Upsell 2; não comprou, recebe o Downsell 1.","Crie a regra dos downsells: quem compra o Downsell 1 ou o Downsell 2 também segue para o Upsell 2; quem recusa o Downsell 2 sai do fluxo.","Crie a regra do Upsell 2: comprou, fim do fluxo; não comprou, recebe o Downsell 1 do Upsell 2 e, se recusar, o Downsell 2 do Upsell 2.","Depois do Downsell 2 do Upsell 2 o fluxo termina, tendo comprado ou não.","Defina um prazo curto para cada oferta (a primeira na página de obrigado, as seguintes em 24 a 48 horas) e deixe o prazo claro.","Teste o fluxo inteiro comprando e recusando em cada ponto antes de ligar para o público.","Toda semana, olhe a taxa de cada oferta e troque primeiro a mais fraca."],"regras":["Entrada: qualquer pessoa que comprou um produto de aquisição.","Canais: WhatsApp e e-mails, cada caixa do fluxo tem a sua mensagem.","Quem recusa o Upsell 1 não sai: desce para o Downsell 1 e depois para o Downsell 2.","Quem compra qualquer downsell do Upsell 1 volta para o Upsell 2.","O Upsell 2 tem 2 downsells próprios; depois do Downsell 2 do Upsell 2 o fluxo acaba, com ou sem compra.","No máximo 2 upsells e 4 downsells por comprador."],"metricas":["Taxa de compra do Upsell 1 e do Upsell 2","Taxa de compra de cada downsell","Ticket médio por comprador","Pedidos de reembolso das ofertas extras"],"erro_comum":"Oferecer um upsell sem ligação com o que a pessoa acabou de comprar, ou parar no primeiro não sem mostrar o downsell."},{"numero":2,"nome":"Meteórico","objetivo":"Vender uma oferta em poucos dias para a sua base, concentrada num grupo de WhatsApp, com a oferta revelada em vídeo e carrinho que abre, fecha e reabre.","para_quem":"Quem já tem base de leads, alunos ou seguidores (não serve para quem parte do zero). Encaixa melhor em ofertas de R$498 a R$3.000 com o comercial na recuperação; acima de R$3.000, o grupo gera consciência e o comercial é o motor.","duracao":"De 7 a 10 dias: aquecimento no grupo, abertura, reabertura e mais 2 a 4 dias de carrinho com o comercial","mermaid":"flowchart LR\n  S1[\"API oficial\"]:::origem --> G[\"Grupo de WhatsApp direto\"]:::canal\n  S2[\"E-mail\"]:::origem --> G\n  S3[\"Grupos antigos de alunos\"]:::origem --> G\n  S4[\"Área de membros (banner e pop-up)\"]:::origem --> G\n  S5[\"SMS e ligação\"]:::origem --> G\n  S6[\"Tráfego pago (remarketing)\"]:::origem --> G\n  G --> E{\"Entrou no grupo?\"}:::decisao\n  E --> P[\"Pesquisa via API e grupo\"]:::canal\n  P --> L[\"Lembretes no grupo\"]:::canal\n  L --> L1[\"Expectativa com mistério\"]:::acao\n  L1 --> L2[\"Prova social\"]:::acao\n  L2 --> L3[\"Quebra de objeções\"]:::acao\n  L3 --> L4[\"Lembretes do dia da oferta\"]:::acao\n  L --> O[\"Oferta revelada\"]:::acao\n  O --> V[\"Oferta revelada via VSL\"]:::acao\n  O --> AB[\"Abertura de carrinho\"]:::checkout\n  AB --> M1[\"1 mensagem por hora\"]:::canal\n  M1 --> C1[\"Comercial abre no 1x1\"]:::canal\n  AB --> R[\"Reabertura com bônus avalanche\"]:::checkout\n  R --> M2[\"1 mensagem por hora\"]:::canal\n  M2 --> C2[\"Comercial reabre no 1x1\"]:::canal\n  C2 --> C3[\"Carrinho aberto mais 2 a 4 dias\"]:::acao\n  C3 --> FIM[\"Fim do fluxo\"]:::fim\n  R --> FIM\n  E --> CRM[\"CRM comercial\"]:::acao\n  CRM --> CS[\"Abordagem como CS 1x1\"]:::canal\n  CS --> LP[\"Lembretes personalizados 1x1\"]:::canal\n  classDef origem fill:#DBEAFE,stroke:#1D4ED8;\n  classDef acao fill:#F4F4F2,stroke:#6B6B6B;\n  classDef canal fill:#EDE9FE,stroke:#6D28D9;\n  classDef decisao fill:#FCE7F3,stroke:#BE185D;\n  classDef checkout fill:#DCFCE7,stroke:#15803D;\n  classDef fim fill:#FEF3C7,stroke:#B45309;\n  classDef perdido fill:#FEE2E2,stroke:#B91C1C;","precisa_ter":["Base para encher o grupo (lista de e-mail, alunos antigos, área de membros, contatos para SMS e ligação, público de remarketing)","Grupo de WhatsApp só para a campanha","API oficial do WhatsApp para pesquisa, convites e lembretes","CRM e time comercial para o atendimento 1x1","Oferta definida e VSL de revelação gravada","Bônus avalanche reservado para a reabertura","Checkout pronto com as datas de abertura, fechamento e reabertura"],"passo_a_passo":["Defina a oferta, o dia da revelação, o dia da abertura, o dia da reabertura e o bônus avalanche.","Crie o grupo de WhatsApp e convide pelas 6 fontes: API oficial, e-mail, grupos antigos de alunos, área de membros (banner e pop-up), SMS e ligação, tráfego pago de remarketing.","Quem entra no grupo responde a pesquisa, enviada pela API oficial e deixada na descrição do grupo.","Ao mesmo tempo, cada lead que entra vai para o CRM comercial e recebe uma abordagem 1x1 no WhatsApp como atendimento (CS), não como venda.","No grupo, rode os lembretes nesta ordem: expectativa usando mistério, prova social usando a pesquisa, quebra de objeções usando a pesquisa e lembretes para o dia da oferta.","Em paralelo, o comercial manda lembretes personalizados 1x1 para garantir que o lead esteja presente na revelação.","No dia marcado, revele a oferta no grupo através da VSL.","Abra o carrinho: 1 mensagem de vendas por hora no grupo, e o comercial faz a abertura no 1x1 com todos os leads.","Feche o carrinho e depois reabra liberando o bônus avalanche, de novo com 1 mensagem de vendas por hora.","Na reabertura, o comercial faz a reabertura no 1x1 com todos os leads.","Libere o bônus da reabertura também para quem comprou no dia anterior.","Depois do fechamento no grupo, o comercial segue com o carrinho aberto por mais 2 a 4 dias no 1x1.","Tire do follow do comercial todo mundo que já comprou e registre as vendas por canal (grupo e comercial)."],"regras":["Entradas: API oficial, e-mail, grupos antigos de alunos, área de membros (banner e pop-up), SMS e ligação, tráfego pago (remarketing).","Quem compra não sai do grupo: segue no grupo de vendas.","O bônus da reabertura é liberado para todo mundo que comprou no dia anterior.","Para quem já comprou, o comercial não segue o fluxo de follow.","A pesquisa de entrada alimenta a prova social e a quebra de objeções do grupo.","Abertura e reabertura: 1 mensagem de vendas por hora no grupo."],"metricas":["Taxa de entrada no grupo por fonte","Taxa de resposta à pesquisa","Pessoas que assistiram a VSL de revelação","Conversão do grupo na abertura e na reabertura","Vendas fechadas pelo comercial no 1x1"],"erro_comum":"Revelar a oferta antes da hora e matar o mistério, ou deixar o comercial cobrando quem já comprou."},{"numero":3,"nome":"Desafio de 5 dias (lançamento pago)","objetivo":"Vender o produto principal para um grupo de pessoas que pagaram para entrar, assistiram às aulas ao vivo e chegaram no dia da abertura do carrinho já convencidas. O ingresso paga parte do tráfego e o carrinho, aberto na aula 3, traz o lucro.","para_quem":"Quem vende infoproduto, mentoria, consultoria ou serviço com produto principal a partir de R$500, já tem público que confia nele (seguidores ativos, lista de e-mail, alunos antigos) e já fez pelo menos um lançamento gratuito. Não é o primeiro funil de quem está começando.","duracao":"De 4 a 6 semanas no total: cerca de 3 a 4 semanas vendendo ingresso e aquecendo o grupo, 5 dias de aulas ao vivo e de 2 a 3 dias de carrinho aberto depois da aula 5.","mermaid":"flowchart LR\n  S1[\"API oficial\"]:::origem --> G[\"Grupo de WhatsApp direto\"]:::canal\n  S2[\"E-mail\"]:::origem --> G\n  S3[\"Grupos antigos de alunos\"]:::origem --> G\n  S4[\"Área de membros (banner e pop-up)\"]:::origem --> G\n  S5[\"SMS e ligação\"]:::origem --> G\n  S6[\"Tráfego pago (remarketing)\"]:::origem --> G\n  G --> E{\"Entrou no grupo?\"}:::decisao\n  E --> P[\"Pesquisa via API e grupo\"]:::canal\n  P --> L[\"Lembretes no grupo\"]:::canal\n  L --> L1[\"Aumento de expectativa\"]:::acao\n  L1 --> L2[\"Prova social\"]:::acao\n  L2 --> L3[\"Objeções sobre o evento\"]:::acao\n  L3 --> L4[\"Lembretes da Aula 1\"]:::acao\n  L --> A1[\"Aula 1\"]:::origem\n  A1 --> A2[\"Aula 2\"]:::origem\n  A2 --> A3[\"Aula 3\"]:::origem\n  A3 --> A4[\"Aula 4\"]:::origem\n  A4 --> A5[\"Aula 5\"]:::origem\n  A5 --> FC[\"Fechamento no marketing\"]:::acao\n  FC --> FIM[\"Fim do fluxo\"]:::fim\n  A3 --> AC[\"Abertura de carrinho\"]:::acao\n  AC --> Q[\"Leads mais quentes\"]:::acao\n  Q --> CV[\"Comercial vende 1x1\"]:::canal\n  CV --> CK[\"Checkout\"]:::checkout\n  AC --> GE[\"Grupos e e-mails\"]:::canal\n  GE --> FV[\"Vendas e aula do dia\"]:::acao\n  FV --> CK\n  A4 --> CK\n  A5 --> CK\n  E --> CRM[\"CRM comercial\"]:::acao\n  CRM --> CS[\"Abordagem como CS 1x1\"]:::canal\n  CS --> LP[\"Lembretes personalizados 1x1\"]:::canal\n  classDef origem fill:#DBEAFE,stroke:#1D4ED8;\n  classDef acao fill:#F4F4F2,stroke:#6B6B6B;\n  classDef canal fill:#EDE9FE,stroke:#6D28D9;\n  classDef decisao fill:#FCE7F3,stroke:#BE185D;\n  classDef checkout fill:#DCFCE7,stroke:#15803D;\n  classDef fim fill:#FEF3C7,stroke:#B45309;\n  classDef perdido fill:#FEE2E2,stroke:#B91C1C;","precisa_ter":["Produto principal pronto e com preço a partir de R$500 (abaixo disso a conta do lançamento pago não fecha)","Pelo menos um lançamento gratuito já feito, para ter base aquecida e grupos antigos","Página do ingresso com checkout, order bump e upsell configurados (nunca vender a gravação das aulas no upsell)","Grupo de WhatsApp do desafio com link na página de obrigado e API oficial para disparos e pesquisa","Canais de entrada ligados: e-mail, grupos antigos de alunos, banner e pop-up na área de membros, SMS e ligação, anúncios de remarketing","CRM comercial e um time (ou pelo menos uma pessoa) para abordar cada comprador de ingresso no 1x1","Especialista que grava vídeos simples e nativos toda semana para os anúncios","Roteiro das 5 aulas com a oferta preparada para a aula 3 e plataforma de transmissão testada"],"passo_a_passo":["Abrir um lote 0 mais barato (por exemplo R$27) só para os grupos antigos de alunos e a lista quente, com vagas limitadas, antes da abertura geral","Abrir o lote 1 (referência R$47) para todos e mandar o convite por e-mail, área de membros (banner e pop-up), SMS, ligação, API oficial e anúncios de remarketing","Levar todo canal para a página do ingresso; quem compra vê o order bump no checkout, o upsell na página de obrigado e entra direto no grupo de WhatsApp","Virar o lote toda semana (R$57, R$67, R$77) com stories, aviso no grupo e anúncio reforçado no dia da virada, sempre virada real e nunca contador falso","Colocar 65% a 70% da verba nessa fase, com cerca de 80% do dinheiro em público quente e 20% em público frio","Gravar um vídeo curto para cada objeção e cada oportunidade do método e trocar os anúncios a cada 5 a 7 dias","Conferir quem comprou e não entrou no grupo e chamar essas pessoas pela API oficial, por e-mail e por ligação até entrarem","Rodar a pesquisa pela API oficial e deixar a pesquisa fixada na descrição do grupo, para saber dor, momento e nível de cada pessoa","Mandar cada comprador para o CRM comercial e fazer a abordagem como sucesso do cliente no 1x1 do WhatsApp nas primeiras 24 horas, por pessoa e nunca por robô","Postar no grupo em ordem: aumento de expectativa, prova social de quem já fez, quebra de objeções sobre o evento e lembretes para o dia da aula 1","Na última semana, lembrete diário no grupo e lembrete personalizado no 1x1 para quem a pesquisa mostrou que tem mais chance de faltar","Entregar conteúdo de verdade, com uma vitória rápida que a pessoa consegue aplicar no mesmo dia","Plantar a oferta sem vender: mostrar resultados de alunos, citar o que o produto principal aprofunda e avisar que algo especial vem na aula 3","Deixar o time no chat da aula respondendo dúvidas e anotando quem mais participa","Depois de cada aula, mandar resumo e tarefa no grupo e lembrete da próxima aula no grupo e no 1x1","Medir quantos compradores apareceram em cada aula e chamar no privado quem faltou","Fazer a oferta do produto principal ao vivo na aula 3 e abrir o carrinho na hora, com link no chat, no grupo e por e-mail","Separar os leads mais quentes (respostas da pesquisa, presença nas aulas, conversa no 1x1) e passar para o comercial fazer a venda no 1x1","Para os demais, mudar a comunicação dos grupos e dos e-mails para foco em vendas: provas, bônus, condição de pagamento e quebra de objeção do produto","Manter a antecipação da aula do dia junto com a venda, para que quem ainda não comprou continue indo às aulas","Medir quantas pessoas chegaram ao checkout e quantas pararam nele e chamar quem parou","Seguir entregando conteúdo e repetir a oferta em cada aula, com link do checkout no chat e no grupo","Responder ao vivo as objeções que mais apareceram no 1x1 e no grupo desde a aula 3","Mostrar quem já comprou e o que essas pessoas estão fazendo, como prova de que o produto funciona para gente parecida","Na aula 5, fazer a oferta mais forte do desafio e anunciar a data e a hora exatas do fechamento do carrinho","Manter o carrinho aberto de 2 a 3 dias depois da aula 5 com e-mails, mensagens no grupo e lembretes de que o prazo está acabando","Rodar anúncios de remarketing (5% a 10% da verba) para quem viu as aulas e não comprou","O comercial faz a última rodada de 1x1 com quem visitou o checkout e com os leads quentes que ainda não compraram","Fechar o carrinho no horário anunciado, sem prorrogar, e avisar no grupo que fechou","Calcular o resultado final (ROAS do lançamento, conversão e faturamento) só depois do fechamento e registrar o que funcionou para o próximo"],"regras":["Nunca vender o ingresso abaixo de R$19: o comparecimento despenca","Nunca fazer dois lançamentos pagos seguidos: intercalar com lançamento gratuito","Não fazer lançamento pago na Black Friday: nessa época o público quer desconto, não projeto novo","Não vender a gravação das aulas no upsell: quem compra a gravação deixa de ir ao vivo, e é ao vivo que se compra","Custo por ingresso de até 4 vezes o valor do ingresso é aceitável, porque o lucro vem do carrinho","O follow-up começa na compra do ingresso, não na semana das aulas, e é feito por gente","A promessa do anúncio, das aulas e do produto principal é a mesma; muda só a forma de falar","Olhar o custo por venda somando todos os canais, nunca só o que o gerenciador de anúncios mostra"],"metricas":["Custo por ingresso: até 4 vezes o valor do ingresso (com ingresso de R$47, até R$188)","ROAS do front (ingresso + order bump + upsell sobre a verba): quanto mais perto de 1, melhor; tudo o que entra aqui reduz o risco do lançamento","Conversão do order bump: referência de 20% a 30% de quem compra o ingresso","Compradores que entraram no grupo: meta acima de 90%","Comparecimento na aula 1: meta de 60% a 70% dos compradores de ingresso, e acompanhar a queda de aula em aula","Conversão do carrinho: porcentagem de compradores de ingresso que compram o produto principal; referência de 5% a 15%","ROAS final do lançamento: faturamento total dividido pela verba de anúncio, calculado só depois do fechamento do carrinho"],"erro_comum":"Tratar o desafio como evento e não como funil de venda: vender o ingresso, sumir até a aula 1 e deixar o grupo parado. Sem pesquisa, sem abordagem 1x1 e sem lembretes desde o dia da compra, metade de quem pagou não aparece, e quem não aparece na aula 3 não vê a oferta. O comparecimento se constrói na hora que a pessoa compra o ingresso.","como_funciona_o_ingresso":"Para entrar no desafio a pessoa paga um ingresso, geralmente entre R$27 e R$77. O preço sobe por lotes, cerca de R$10 por semana, e cada virada real de lote faz uma onda de compras de quem estava adiando. Quem paga aparece mais nas aulas e compra mais no carrinho do que quem entrou de graça, então o ingresso filtra curioso e chama comprador. O dinheiro do ingresso, somado ao order bump e ao upsell, devolve parte da verba de anúncio antes mesmo de o carrinho abrir.","fases":[{"fase":"Captação com ingresso","passos":["Abrir um lote 0 mais barato (por exemplo R$27) só para os grupos antigos de alunos e a lista quente, com vagas limitadas, antes da abertura geral","Abrir o lote 1 (referência R$47) para todos e mandar o convite por e-mail, área de membros (banner e pop-up), SMS, ligação, API oficial e anúncios de remarketing","Levar todo canal para a página do ingresso; quem compra vê o order bump no checkout, o upsell na página de obrigado e entra direto no grupo de WhatsApp","Virar o lote toda semana (R$57, R$67, R$77) com stories, aviso no grupo e anúncio reforçado no dia da virada, sempre virada real e nunca contador falso","Colocar 65% a 70% da verba nessa fase, com cerca de 80% do dinheiro em público quente e 20% em público frio","Gravar um vídeo curto para cada objeção e cada oportunidade do método e trocar os anúncios a cada 5 a 7 dias"]}, egando conteúdo e repetir a oferta em cada aula, com link do checkout no chat e no grupo","Responder ao vivo as objeções que mais apareceram no 1x1 e no grupo desde a aula 3","Mostrar quem já comprou e o que essas pessoas estão fazendo, como prova de que o produto funciona para gente parecida","Na aula 5, fazer a oferta mais forte do desafio e anunciar a data e a hora exatas do fechamento do carrinho"]},{"fase":"Fechamento","passos":["Manter o carrinho aberto de 2 a 3 dias depois da aula 5 com e-mails, mensagens no grupo e lembretes de que o prazo está acabando","Rodar anúncios de remarketing (5% a 10% da verba) para quem viu as aulas e não comprou","O comercial faz a última rodada de 1x1 com quem visitou o checkout e com os leads quentes que ainda não compraram","Fechar o carrinho no horário anunciado, sem prorrogar, e avisar no grupo que fechou","Calcular o resultado final (ROAS do lançamento, conversão e faturamento) só depois do fechamento e registrar o que funcionou para o próximo"]}]},{"numero":4,"nome":"Funil de Webinário","objetivo":"Levar o lead a uma apresentação ao vivo e vender em três canais ao mesmo tempo, recuperando quem não comprou até o fechamento.","para_quem":"Faixa principal de R$498 a R$3.000, com recuperação comercial; acima de R$3.000, o webinário gera consciência e o comercial é o motor com diagnóstico. Melhor com base; dá para começar do zero com tráfego pago, com mais trabalho.","duracao":"De 7 a 10 dias de captação e aquecimento, o dia da live e de 3 a 5 dias de recuperação","mermaid":"flowchart LR\n  S1[\"API oficial\"]:::origem --> G[\"Grupo de WhatsApp\"]:::canal\n  S2[\"E-mail\"]:::origem --> G\n  S3[\"Grupos antigos de alunos\"]:::origem --> G\n  S4[\"Área de membros (banner e pop-up)\"]:::origem --> G\n  S5[\"SMS e ligação\"]:::origem --> G\n  S6[\"Tráfego pago (remarketing)\"]:::origem --> G\n  G --> CRM[\"CRM comercial\"]:::acao\n  G --> CS[\"Abordagem como CS 1x1\"]:::canal\n  G --> LP[\"Lembretes personalizados 1x1\"]:::canal\n  G --> LW[\"Lembretes WhatsApp\"]:::canal\n  G --> LA[\"Lembretes API oficial\"]:::canal\n  CRM --> W[\"Webinário\"]:::acao\n  CS --> W\n  LP --> W\n  LW --> W\n  LA --> W\n  W --> OL[\"Oferta liberada no webinário\"]:::acao\n  OL --> VW[\"Vendas WhatsApp\"]:::canal\n  OL --> DA[\"Disparo na API oficial\"]:::canal\n  OL --> VC[\"Vendas comercial 1x1\"]:::canal\n  VW --> DA\n  DA --> VC\n  VC --> CK[\"Checkout\"]:::checkout\n  CK --> D{\"Comprou?\"}:::decisao\n  D -->|Sim| FIM[\"Fim do fluxo\"]:::fim\n  D -->|\"Não\"| REC[\"Recuperação até o fechamento\"]:::acao\n  classDef origem fill:#DBEAFE,stroke:#1D4ED8;\n  classDef acao fill:#F4F4F2,stroke:#6B6B6B;\n  classDef canal fill:#EDE9FE,stroke:#6D28D9;\n  classDef decisao fill:#FCE7F3,stroke:#BE185D;\n  classDef checkout fill:#DCFCE7,stroke:#15803D;\n  classDef fim fill:#FEF3C7,stroke:#B45309;\n  classDef perdido fill:#FEE2E2,stroke:#B91C1C;","precisa_ter":["Base para convidar ou verba de tráfego pago para captar do zero","Grupo de WhatsApp do webinário e API oficial","Tema do webinário e apresentação com a oferta no final","Pessoa para conduzir a live","CRM e time comercial para a abordagem 1x1 desde a entrada","Checkout pronto e data de fechamento definida","Sequência de e-mails para lembrete e recuperação"],"passo_a_passo":["Defina o tema, a data e o horário da live, a oferta e a data de fechamento do carrinho.","Convide pelas 6 fontes (API oficial, e-mail, grupos antigos de alunos, área de membros com banner e pop-up, SMS e ligação, tráfego pago de remarketing) e leve todo mundo para o grupo de WhatsApp.","Assim que o lead entra no grupo, ele vai para o CRM comercial e o comercial já aborda no 1x1 como atendimento (CS).","Nesta fase o objetivo é só relacionamento e comparecimento na live.","Rode os lembretes em paralelo: personalizados 1x1 pelo comercial, no grupo de WhatsApp e pela API oficial, aumentando a frequência no dia da live.","Faça o webinário e libere a oferta durante a apresentação.","Logo depois da oferta, venda em paralelo nos três canais: mensagens no WhatsApp, disparo na API oficial e comercial no 1x1.","Todos os caminhos levam ao mesmo checkout.","Quem comprou sai da comunicação de venda e termina o fluxo.","Quem não comprou entra em recuperação até o fechamento: mais follows do comercial, mensagens no WhatsApp e e-mails.","No dia do fechamento, avise o fim do prazo em todos os canais e encerre.","Registre comparecimento, vendas por canal e motivos de não compra para a próxima turma."],"regras":["Entradas: API oficial, e-mail, grupos antigos de alunos, área de membros (banner e pop-up), SMS e ligação, tráfego pago (remarketing).","Assim que o lead entra no grupo, o comercial já aborda.","Objetivo da fase de grupo: relacionamento e comparecimento na live.","Depois da oferta, as vendas acontecem em paralelo: WhatsApp, API oficial e comercial 1x1.","Quem não comprou não sai: continua em recuperação até o fechamento (mais follows, mensagens no WhatsApp e e-mails)."],"metricas":["Custo por inscrito e entrada no grupo","Taxa de comparecimento na live","Conversão de quem assistiu","Vendas por canal (WhatsApp, API oficial, comercial 1x1)","Vendas na fase de recuperação"],"erro_comum":"Encher o grupo e só falar com o lead no dia da live, sem o comercial criar relacionamento antes."},{"numero":5,"nome":"Funil de Área de Membros","objetivo":"Transformar quem já comprou em comprador da próxima oferta usando a própria área de membros como vitrine.","para_quem":"Quem já tem produto vendido e entregue em área de membros (sem produto não funciona). O destino da oferta depende do ticket: até R$497, página de vendas com ou sem vídeo; de R$498 a R$3.000, webinário ou desafio com recuperação comercial; acima de R$3.000, webinário ou desafio para consciência e o comercial como motor, com diagnóstico.","duracao":"Contínuo, enquanto o aluno tem acesso","mermaid":"flowchart LR\n  A[\"Comprou um produto\"]:::origem --> AM[\"Área de Membros\"]:::canal\n  AM --> B1[\"Aula de boas-vindas\"]:::acao\n  AM --> B2[\"Micro-pitchs nas aulas\"]:::acao\n  AM --> B3[\"Aulas pitch entre fases\"]:::acao\n  AM --> B4[\"Banners abaixo das aulas\"]:::acao\n  AM --> B5[\"Produto bloqueado\"]:::acao\n  B1 --> D{\"Comprou?\"}:::decisao\n  B2 --> D\n  B3 --> D\n  B4 --> D\n  B5 --> D\n  D -->|\"Não\"| PM[\"Permanece na área de membros\"]:::acao\n  D -->|Sim| T{\"Tem upsell?\"}:::decisao\n  T -->|Sim| FU[\"Fluxo de Upsell\"]:::acao\n  T -->|\"Não\"| FIM[\"Fim do fluxo\"]:::fim\n  classDef origem fill:#DBEAFE,stroke:#1D4ED8;\n  classDef acao fill:#F4F4F2,stroke:#6B6B6B;\n  classDef canal fill:#EDE9FE,stroke:#6D28D9;\n  classDef decisao fill:#FCE7F3,stroke:#BE185D;\n  classDef checkout fill:#DCFCE7,stroke:#15803D;\n  classDef fim fill:#FEF3C7,stroke:#B45309;\n  classDef perdido fill:#FEE2E2,stroke:#B91C1C;","precisa_ter":["Pelo menos 1 produto vendido e entregue em área de membros","Pelo menos 1 oferta para empurrar dentro da área","Área de membros que aceite banner, link dentro da aula e produto bloqueado visível","Destino da oferta montado conforme o ticket (página de vendas, webinário, desafio ou comercial)","Fluxo de Upsell pronto para quem comprar"],"passo_a_passo":["Mapeie a jornada do aluno dentro do produto e marque as fases de vitória (os pontos em que ele sente resultado).","Escolha a oferta que vai ser empurrada e defina o destino pelo ticket: até R$497 página de vendas; de R$498 a R$3.000 webinário ou desafio com recuperação comercial; acima de R$3.000 comercial com diagnóstico.","Grave a aula de boas-vindas (comece por aqui), mostrando o caminho completo, inclusive onde a oferta entra.","Coloque micro-pitchs invisíveis dentro das aulas: menções curtas à próxima oferta quando o assunto pede.","Grave aulas pitch e posicione entre as fases de vitória, quando o aluno acabou de ter um resultado.","Coloque banners abaixo das aulas apontando para o destino da oferta.","Deixe o produto da oferta visível e bloqueado dentro da área, com o botão para liberar.","Quem function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2200); }
function tema(){ const r = document.documentElement; const atual = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = atual === "dark" ? "light" : "dark"; localStorage.setItem("im-tema", r.dataset.theme); }
if (localStorage.getItem("im-tema")) document.documentElement.dataset.theme = localStorage.getItem("im-tema");

/* ---------- login ---------- */
const SENHA_PADRAO = "Netanias12345";
const voltaLogin = () => location.origin + location.pathname;
function telaLogin(msg = ""){
  $("#root").innerHTML = `<main class="login"><div class="panel">${marca}
    <h1>Entrar</h1>
    <form class="form" id="f-login"><label>E-mail<input type="email" name="email" required autocomplete="email" inputmode="email"></label>
    <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Entrar</button></form>
    <button class="btn" id="b-link" type="button" style="justify-self:start">Primeiro acesso / esqueci a senha</button>
    <p class="muted" id="login-msg" role="status">${esc(msg)}</p>
    <button class="btn" id="b-tema" style="justify-self:start">Tema claro/escuro</button></div></main>`;
  $("#b-tema").onclick = tema;
  const aviso = t => { $("#login-msg").textContent = t; };
  $("#b-link").onclick = async () => {
    const email = $("#f-login").email.value.trim();
    if (!email) return aviso("Digite seu e-mail acima e toque de novo para receber o link de acesso.");
    if (!sb) return aviso("Sistema em configuração.");
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: voltaLogin() } });
    aviso(error ? "Não consegui enviar o link. Confira o e-mail e tente de novo." : "Pronto. Abra seu e-mail e toque no link para entrar.");
  };
  $("#f-login").onsubmit = async e => { e.preventDefault();
    const email = e.target.email.value.trim(), password = e.target.senha.value;
    if (!sb) return aviso("Sistema em configuração.");
    aviso("Entrando…");
    let { error } = await sb.auth.signInWithPassword({ email, password });
    if (error && password === SENHA_PADRAO && /invalid/i.test(error.message || "")) {
      const { data: ok } = await sb.rpc("im_liberado_email", { e: email });
      if (ok) {
        const cad = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: voltaLogin() } });
        if (cad.error) return aviso("Não consegui criar seu acesso. Use o link de primeiro acesso abaixo.");
        ({ error } = await sb.auth.signInWithPassword({ email, password }));
        if (error && /confirm/i.test(error.message || "")) return aviso("Confirme seu e-mail pelo link que enviamos e depois entre de novo.");
      }
    }
    if (error) return aviso("E-mail ou senha incorretos. Se é seu primeiro acesso, use a senha que o Netanias te passou.");
  };
}
function telaSenha(obrigatoria){
  const alvo = obrigatoria ? $("#root") : $("#main");
  const html = `<div class="panel" style="max-width:420px;width:100%;padding:28px;display:grid;gap:14px">${obrigatoria ? marca : ""}
    <h1>${obrigatoria ? "Crie sua senha" : "Trocar senha"}</h1>
    <p class="muted">${obrigatoria ? "Antes de entrar, troque a senha inicial por uma só sua." : "Escolha uma senha nova."} Mínimo de 8 caracteres.</p>
    <form class="form" id="f-senha"><label>Nova senha<input type="password" name="s1" required minlength="8" autocomplete="new-password"></label>
    <label>Repita a nova senha<input type="password" name="s2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">Salvar senha</button></form>
    ${obrigatoria ? '<button class="btn" id="b-sair2" style="justify-self:start">Sair</button>' : '<a class="btn" href="#inicio" style="justify-self:start">Cancelar</a>'}
    <p class="muted" id="senha-msg" role="status"></p></div>`;
  alvo.innerHTML = obrigatoria ? `<main class="login">${html}</main>` : html;
  if (obrigatoria) $("#b-sair2").onclick = sair;
  $("#f-senha").onsubmit = async e => { e.preventDefault();
    const s1 = e.target.s1.value, s2 = e.target.s2.value, msg = t => { $("#senha-msg").textContent = t; };
    if (s1.length < 8) return msg("A senha precisa ter pelo menos 8 caracteres.");
    if (s1 === SENHA_PADRAO) return msg("Escolha uma senha diferente da senha inicial.");
    if (s1 !== s2) return msg("As duas senhas não estão iguais.");
    const { error } = await sb.auth.updateUser({ password: s1, data:{ senha_trocada: true } });
    if (error) return msg("Não consegui salvar a senha. Tente outra.");
    if (obrigatoria) iniciar(); else { toast("Senha trocada."); location.hash = "inicio"; }
  };
}

function abrirTranscricao(e, fm){

      ${e.gancho ? `<p><b>Gancho:</b> ${esc(e.gancho)}</p>` : ""}${e.resumo ? `<p class="muted"><b>Resumo:</b> ${esc(e.resumo)}</p>` : ""}

  const focaveis = () => [...ov.querySelectorAll('button,[tabindex="0"]')];

    if (ev.key !== "Tab") return;
