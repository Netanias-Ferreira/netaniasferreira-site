<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inteligência do Mercado · Netanias Ferreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de membros, menu lateral fixo + área principal com rotas por hash; no celular o menu vira gaveta */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#ECEBE8; --line:#DCDAD5;
  --fg:#1E1E1E; --muted:#6B6863; --accent:#B8584B; --accent-fg:#FFFFFF; --accent-soft:#F3E2DE;
  --ok:#2F7D5B; --ok-soft:#DDEFE6;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292826; --line:#34322F;
  --fg:#EDEBE7; --muted:#A39F98; --accent:#D97A6B; --accent-fg:#1A1110; --accent-soft:#3A2522;
  --ok:#6CC59D; --ok-soft:#1E3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#1F1F1F; --surface-2:#292826; --line:#34322F;
  --fg:#EDEBE7; --muted:#A39F98; --accent:#D97A6B; --accent-fg:#1A1110; --accent-soft:#3A2522;
  --ok:#6CC59D; --ok-soft:#1E3329; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:20px} h3{font-size:15px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* menu lateral */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.brand b{font-family:var(--font-display);font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:11px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .mono{color:var(--muted);padding:0 8px 6px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.nav a.on .count{color:var(--accent)}
.side-cta{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.side-cta p{font-size:12px}
.user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600}
/* principal */
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;text-decoration:none}
.pill.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.fav-on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.search{display:flex;gap:8px}
.search input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;min-width:0;width:220px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;white-space:nowrap}
.chip .n{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:4px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on .n{color:var(--bg);opacity:.7}
.filterbar{display:flex;flex-direction:column;gap:10px}
.showing{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:11px;color:var(--muted);gap:6px}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.tag.funil{background:var(--accent-soft);color:var(--accent)}
.tag.meu{background:var(--ok-soft);color:var(--ok)}
.thumb{aspect-ratio:4/5;position:relative;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:0;width:100%}
.play{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff;font-size:15px}
.card-body{padding:10px;display:grid;gap:8px}
.card-body h3{font-size:14px}
.metrics{display:flex;gap:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{padding:5px 9px;font-size:12px}
/* miniaturas desenhadas por formato */
.t-preta{background:#0E0E0E;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;text-align:center;padding:18px;line-height:1.15}
.t-notas{background:#FBF7E8;color:#222;align-content:start;justify-items:start;padding:16px;gap:6px;font-size:11px;text-align:left}
.t-notas b{font-size:14px;color:#111}
.t-notas i{font-style:normal;color:#C79A14;font-size:11px}
.t-zap{background:#E9DFD4;align-content:start;padding:14px;gap:6px;justify-items:stretch}
.bub{background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:#222;max-width:80%}
.bub.me{background:#D7F5C9;justify-self:end}
.t-verde{background:linear-gradient(#7A9BB8,#486A86);color:#fff}
.t-verde .face{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:62%;height:42%;background:#2A2522;border-radius:50% 50% 0 0}
.t-verde .shot{position:absolute;top:12%;left:12%;right:12%;height:38%;background:#fff;border-radius:6px;color:#222;font-size:11px;padding:8px;font-weight:600}
.t-div{grid-template-rows:1fr 1fr;place-items:stretch}
.t-div span:first-child{background:#3B4A5A}
.t-div span:last-child{background:#B9A58A}
.t-ad{grid-template-columns:1fr 1fr;place-items:stretch;font-size:11px;font-weight:700;color:#fff}
.t-ad span{display:grid;place-items:center}
.t-ad span:first-child{background:#6E6A66}
.t-ad span:last-child{background:#2F7D5B}
.t-noticia{background:#F1F1F1;align-content:start;padding:0}
.t-noticia .bar{background:#C0262D;color:#fff;font-weight:700;font-size:11px;padding:6px 10px;width:100%}
.t-noticia p{padding:10px;color:#111;font-family:Georgia,serif;font-size:14px;font-weight:700;text-align:left}
.t-post{background:#fff;align-content:start;justify-items:start;padding:14px;gap:8px;color:#111;text-align:left;font-size:12px}
.t-post .who{display:flex;gap:6px;align-items:center;font-weight:600}
.t-post .who i{width:20px;height:20px;border-radius:50%;background:#1D9BF0}
/* listas e páginas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:6px}
.row:first-child{border-top:0}
.row-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.row-head .num{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:24px;flex:none}
.row-head .t{flex:1;min-width:0}
.row-head .t b{display:block;font-family:var(--font-display);font-size:15px}
.open-box{display:grid;gap:10px;padding:6px 0 4px 36px}
.example{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px}
.prompt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;overflow-x:auto}
.prompt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.group-head{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.group-head .mono{color:var(--accent)}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.piece{padding:16px;display:grid;gap:8px;align-content:start}
.piece .mono{color:var(--accent)}
.funnel{display:grid;gap:8px;justify-items:center}
.lvl{border:0;color:var(--bg);background:var(--fg);padding:14px 10px;text-align:center;border-radius:6px;display:grid;gap:2px;transition:transform .15s}
.lvl:hover{transform:scale(1.01)}
.lvl b{font-family:var(--font-display);font-size:15px}
.lvl small{opacity:.75}
.hook{display:grid;gap:8px}
.hook-text{font-size:15px;line-height:1.6}
.slot{background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.src{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.adv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.adv .logo{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:16px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.video{aspect-ratio:16/9;background:linear-gradient(135deg,#2B2B2B,#4A3A36);border-radius:var(--r);display:grid;place-items:center;color:#fff;position:relative}
.lessons{display:grid;gap:8px;padding:14px}
.lesson{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:2px}
.lesson.on{border-color:var(--accent);background:var(--accent-soft)}
.onb{display:grid;grid-template-columns:1fr 280px;gap:16px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form textarea,.form select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
details{border-top:1px solid var(--line);padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note-box{display:grid;gap:6px}
.note-box textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);padding:8px;font:inherit}
.impl{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.impl p{max-width:60ch;opacity:.85}
.impl .btn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.foot{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* janela */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:grid}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.modal .thumb{aspect-ratio:9/16;cursor:default}
.modal-foot{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}
.tx-modal{max-width:680px;overflow:hidden;grid-template-rows:auto minmax(0,1fr) auto}
.tx-modal .modal-head h2{font-size:16px}
.tx-body{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 10px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.tx-texto{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.6;background:var(--surface-2);padding:12px;border-radius:8px;margin:0;overflow-wrap:anywhere}
.tx-modal .modal-foot{border-top:1px solid var(--line)}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60}
.proto{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:6px 10px}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:max(20px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .onb{grid-template-columns:1fr}
  .search input{width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .open-box{padding-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Paleta nova (sales dashboard laranja/âmbar), substitui a do protótipo; layout igual */
:root,:root[data-theme="light"]{--bg:#F4F4F2;--surface:#FFFFFF;--surface-2:#F4F4F2;--line:#ECECEC;--fg:#111111;--muted:#6B6B6B;
 --accent:#F7931E;--accent-txt:#C2410C;--accent-fg:#111111;--accent-soft:#FFEDD5;--amber:#FDB022;--yellow:#FFC83D;
 --ok:#15803D;--ok-soft:#DCFCE7;--bad:#DC2626;--blue:#1D4ED8;--blue-soft:#DBEAFE;--r:18px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
 --font-display:"Inter",system-ui,sans-serif;--side-bg:#161616;--side-fg:#FFFFFF;--side-muted:#9A9A9A;--side-on:#2A2A2A;color-scheme:light}
:root[data-theme="dark"]{--bg:#1A1A1A;--surface:#222222;--surface-2:#2A2A2A;--line:#333333;--fg:#F5F5F5;--muted:#A3A3A3;--accent:#F7931E;--accent-fg:#111111;--accent-txt:#FDB022;--accent-soft:#3A2A16;--ok:#4ADE80;--ok-soft:#14321F;--blue:#93C5FD;--blue-soft:#1E2A44;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1A1A;--surface:#222222;--surface-2:#2A2A2A;--line:#333333;--fg:#F5F5F5;--muted:#A3A3A3;--accent:#F7931E;--accent-fg:#111111;--accent-txt:#FDB022;--accent-soft:#3A2A16;--ok:#4ADE80;--ok-soft:#14321F;--blue:#93C5FD;--blue-soft:#1E2A44;color-scheme:dark}}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
.side{background:var(--side-bg);color:var(--side-fg);border-right:0}
.side .brand small,.side .nav-group .mono,.side .user,.side .nav .count{color:var(--side-muted)}
.side .nav a{color:var(--side-fg)} .side .nav a:hover{background:#222}
.side .nav a.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent)} .side .nav a.on .count{color:var(--accent)}
.brand-mark{background:linear-gradient(135deg,var(--accent),var(--amber));color:#111}
.side-cta{background:#1F1F1F;border-color:#2E2E2E;color:#fff}
.side-cta .btn.primary{background:var(--yellow);color:#111;border-color:var(--yellow);font-weight:600}
.side .btn{background:#222;border-color:#333;color:#fff} .avatar{background:var(--accent);color:#111}
.panel,.card{border-radius:var(--r);box-shadow:var(--shadow);border-color:var(--line)}
.btn{border-radius:999px} .btn.primary{background:#111;color:#fff;border-color:#111}
:root[data-theme="dark"] .main .btn.primary{background:#F5F5F5;color:#111;border-color:#F5F5F5}
.btn.fav-on{color:var(--accent-txt);border-color:var(--accent)} .tag.funil{color:var(--accent-txt)}
.mono{color:var(--accent-txt)} .muted.mono,.mono.muted{color:var(--muted)}
select.f{border-radius:999px} .chip.on{background:#111;color:#fff}
.stat{background:var(--surface)} .stats .stat:first-child{background:#1C1C1C;color:#fff;border-color:#1C1C1C}
.stats .stat:first-child .muted{color:#BDBDBD}
.stats .stat:first-child::after{content:"";display:block;height:6px;margin-top:12px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--amber))}
.stat b{font-size:36px;font-weight:800}
.impl{background:#1C1C1C;color:#fff;border-radius:var(--r)} .impl .btn{background:var(--yellow);color:#111;border-color:var(--yellow)}
.status.respondido{background:var(--ok-soft);color:var(--ok)} .status{background:var(--blue-soft);color:var(--blue)}
.example{border-left-color:var(--accent)} :focus-visible{outline-color:var(--accent)}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}} .main{min-width:0;overflow-x:hidden}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .panel{max-width:400px;width:100%;padding:28px;display:grid;gap:14px}
.media{width:100%;max-height:70vh;background:#000;display:block;object-fit:contain;border-radius:8px}
.fmt-card{padding:16px;display:grid;gap:8px;align-content:start;text-decoration:none}
.fmt-card:hover{border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{padding:16px}.stat-link{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}.stat-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.stat-ir{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--accent)}.stats .stat:first-child .stat-ir{color:var(--amber)}.stat b{font-family:var(--font-display);font-size:30px;display:block}
.ex{padding:14px;display:grid;gap:10px;align-content:start}
.ex pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;background:var(--surface-2);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.ex details{padding:0;border:0}
.status{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);white-space:nowrap}

seguir pagar as contas do mês não é liberdade, é sobreviver."]}, {"nivel": "consciente da solução", "titulo": "Sabe o que quer, não conhece você", "o_que_e": "A pessoa já sabe o resultado que deseja e que existe um caminho para chegar lá. Ela só não sabe que a sua oferta entrega isso.", "como_falar": "Abra pelo resultado que ela quer, dito de forma concreta e com número. Depois mostre por que o seu caminho chega lá melhor que os outros, com mecanismo e prova. No high ticket, a prova de casos parecidos com o dela pesa mais que a promessa.", "erro_comum": "Gastar tempo explicando o problema para quem já está procurando a solução.", "etapa_funil": "meio", "exemplos": ["Isso é o que acontece com o corpo de quem faz treino híbrido.", "Quer achar oferta de low ticket? Escreve isso aqui na biblioteca de anúncios.", "Para vender serviços e mentorias de R$5 mil a R$10 mil para pessoas que ainda não conhecem você."]}, {"nivel": "consciente do produto", "titulo": "Conhece você, ainda não decidiu", "o_que_e": "A pessoa já sabe o que você vende e o que a oferta faz. Ela ainda tem dúvida se funciona para ela ou se vale o preço.", "como_falar": "Abra pelo produto e pelo que ele já fez por gente como ela. Entregue prova, detalhes da entrega e resposta para as objeções que travam a decisão. No high ticket, mostre o passo a passo de como é trabalhar com você.", "erro_comum": "Repetir a apresentação genérica em vez de matar a dúvida que impede a compra.", "etapa_funil": "meio", "exemplos": ["Falaram que esse treino não funciona, mas eu testei por 7 dias.", "Vou te mostrar algo que todo eletricista residencial deveria ter.", "Vender 1 mentoria por semana sem abrir turma: anúncio que atrai, aplicação que filtra, sessão que fecha."]}, {"nivel": "totalmente consciente", "titulo": "Já quer, só precisa do empurrão", "o_que_e": "A pessoa conhece a oferta, confia e já quer comprar. Falta só um motivo para agir agora.", "como_falar": "Abra direto pela oferta, condição e prazo. Entregue o que muda hoje: bônus, vaga, condição especial ou fim do prazo. No high ticket, a urgência vem de vaga limitada e agenda real, nunca de desconto inventado.", "erro_comum": "Voltar a explicar o problema e o método para quem só está esperando o convite.", "etapa_funil": "fundo", "exemplos": ["Atenção. Última chance da promoção de feriadão com 40% de desconto.", "A pedidos, estendemos a nossa maior oferta de todos os tempos.", "Apenas hoje está liberado o lote antecipado no menor preço."]}]};
const FICHAS_HT = {"intro":"Formato não é enfeite, é ferramenta: cada um existe para cumprir uma tarefa dentro do funil. Antes de pensar em como gravar, decida o que aquele conteúdo precisa provocar em quem assiste. Com a função clara, o formato certo aparece sozinho e a dúvida de como gravar deixa de travar a produção.","rotacao":"Ninguém precisa usar os 18 formatos: escolha de 4 a 6 que você domina, gire entre eles e coloque um novo em teste por mês, puxando daqui quando algum cansar. Para quem vende mentoria, consultoria ou serviço de alto valor, uma divisão que funciona é cerca de metade do volume no topo, um terço no meio e o restante no fundo. Se o perfil cresce mas ninguém compra, está faltando meio; se nem cresce, está faltando topo.","etapas":[{"etapa":"Topo","titulo":"Chamar atenção","objetivos":[{"objetivo":"Aproveitar um assunto que já está em alta","formatos":["Tela Verde","Twitter Padrão"]},{"objetivo":"Tomar posição contra uma ideia do mercado","formatos":["Opinião","React","Ranking ou Tier List"]},{"objetivo":"Segurar o olhar pela curiosidade","formatos":["Storytelling","B-Roll"]}],"fichas":[{"nome":"Tela Verde","familia":"Vídeo","esforco":"Baixo","o_que_e":"A notícia, o print ou o post fica de fundo e você aparece na frente dando a sua leitura sobre aquilo.","use_quando":"O seu mercado está falando de um assunto e você enxerga um lado que nenhum concorrente está mostrando, algo que conversa com a dor do cliente que compra o seu serviço.","nao_use_quando":"O tema ainda não pegou. Esse formato só aproveita uma conversa que já existe, ele não fabrica interesse do zero.","como_executar":["Separe uma imagem de fundo que já diga o essencial sozinha: manchete, print ou publicação.","Grave com fundo verde ou use o recurso de trocar o fundo do próprio aplicativo de edição.","Entre direto reagindo ao que está atrás de você, sem dizer seu nome nem o que você faz.","Termine com a sua conclusão sobre o caso, nunca repetindo o que a notícia já disse."],"erro_comum":"Ler em voz alta o que está na tela. Se a pessoa consegue ler sozinha, a sua voz virou ruído; o valor está na opinião que só você tem.","vizinhos":["React","Twitter Padrão","Storytelling"],"formatos_catalogo":["Tela Verde"]},{"nome":"React","familia":"Vídeo","esforco":"Baixo","o_que_e":"O vídeo de outra pessoa roda na tela e você comenta a fala dela em cima.","use_quando":"Alguém que o seu público ouve disse algo que você contesta, ou que você concorda e consegue levar mais fundo, mostrando como um especialista de alto valor pensa diferente.","nao_use_quando":"Você não tem uma tese própria para somar. Sem opinião, você só empresta palco e audiência para o outro.","como_executar":["Recorte um trecho curto, de até 15 segundos, que se sustente sem explicação.","Deixe esse trecho tocar antes de você aparecer, para a pessoa entender o contexto.","Congele a imagem no exato momento da frase que você vai rebater ou aprofundar.","Diga a sua posição numa frase só e só depois explique o porquê."],"erro_comum":"Deixar o vídeo alheio ocupar o conteúdo. Quando metade do tempo é a fala do outro, quem sai com autoridade é ele, não você.","vizinhos":["Tela Verde","Caixinha de Perguntas"],"formatos_catalogo":["React"]},{"nome":"Ranking ou Tier List","familia":"Vídeo","esforco":"Médio","o_que_e":"Você coloca em ordem ou em faixas itens que o seu mercado já conhece, normalmente numa tabela visual.","use_quando":"O público já tem opinião sobre aquilo que você vai classificar (ferramentas, estratégias, tipos de oferta) e a discordância vai gerar comentário.","nao_use_quando":"As pessoas não conhecem os itens. Classificar o desconhecido não provoca reação, só deixa todo mundo perdido.","como_executar":["Monte a tabela antes de gravar e mantenha ela visível do começo ao fim.","Comece pelo item em que quase todo mundo concorda, para a pessoa entender a régua.","Inclua de propósito pelo menos uma posição que vai dividir opiniões.","Explique cada lugar com uma frase curta, porque justificativa longa mata o ritmo."],"erro_comum":"Classificar sem dizer o critério. Sem saber o que está sendo medido, quem discorda deixa de debater e passa a desconfiar de você.","vizinhos":["Comparativo","Framework","Storytelling"],"formatos_catalogo":["Tier list","Top 5 (ranking)"]},{"nome":"Storytelling","familia":"Vídeo","esforco":"Médio","o_que_e":"A ideia chega embrulhada num acontecimento: primeiro a pessoa é fisgada pela história, depois recebe a lição.","use_quando":"Você viveu ou acompanhou um caso com tensão e final claro, e a lição só fica forte depois que a pessoa sente o que estava em jogo.","nao_use_quando":"Não existe conflito no que você vai contar. Sem tensão, é só um relato, e relato não segura ninguém.","como_executar":["Entre no ponto mais tenso da história, nunca no começo da linha do tempo.","Deixe claro o que podia ser perdido antes de narrar o que aconteceu.","Guarde o desfecho para o último terço do vídeo.","Feche com a lição numa frase só, porque a história já fez o trabalho pesado."],"erro_comum":"Anunciar que vai contar uma história. Avisar que vem uma história tira a surpresa e quebra o efeito antes de ele começar.","vizinhos":["Estudo de caso (análise)","B-Roll","Falando com a Câmera"],"formatos_catalogo":["Storytelling (vídeo)"]},{"nome":"B-Roll","familia":"Vídeo","esforco":"Médio","o_que_e":"Imagens de apoio passam na tela enquanto a sua narração ou um texto escrito carrega a mensagem.","use_quando":"A ideia é forte no papel ou no áudio, você não tem como gravar falando agora e tem imagens suas que combinam com o que está sendo dito.","nao_use_quando":"Falta mensagem forte ou história boa por trás. Imagem bonita sem conteúdo espalha a atenção em vez de prender.","como_executar":["Escreva ou grave a narração antes de pensar nas imagens.","Escolha cenas que mostrem exatamente o que a fala está dizendo.","Com narração, troque de imagem a cada 2 ou 3 segundos; com texto na tela, segure a mesma cena por uns 10 segundos.","Coloque a frase mais forte logo no primeiro segundo, para a imagem não parecer só decoração."],"erro_comum":"Usar imagem de banco genérica. Para quem vende serviço caro, foto de estoque denuncia que você não tem material próprio para mostrar.","vizinhos":["Storytelling","Bastidores","Estudo de caso (análise)"],"formatos_catalogo":["Narrado"]},{"nome":"Twitter Padrão","familia":"Estático","esforco":"Baixo","o_que_e":"A imagem de uma publicação curta em texto, postada do jeito que ela é.","use_quando":"A frase já existe, já repercutiu, e publicar rápido rende mais do que caprichar na arte.","nao_use_quando":"A imagem está ruim ou a frase é sua e nunca teve alcance. Captura malfeita passa sensação de improviso, e improviso não combina com ticket alto.","como_executar":["Tire a captura em boa resolução e no modo claro.","Corte o enquadramento para esconder os números de interação quando eles forem baixos.","Escreva uma legenda que desenvolva a ideia, porque a imagem sozinha não constrói autoridade.","Quando o tema pedir mais, use a imagem como primeira tela de um carrossel maior."],"erro_comum":"Postar uma frase com pouquíssimas curtidas visíveis. O número baixo vira prova contra você.","vizinhos":["Carrossel Edu","Carrossel Fotos + Texto Nativo","Tela Verde"],"formatos_catalogo":["Estilo Twitter (X)","Tweet"]},{"nome":"Opinião","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você defende uma posição pessoal, forte e verdadeira sobre algo que ama ou odeia: no mercado, no trabalho, nos clientes, na cultura, na fé ou na família. Não é dica nem tutorial, é a sua visão de mundo.","use_quando":"Você quer se posicionar e atrair quem pensa igual. O comprador de alto valor já tem informação, tem IA e tem acesso a tudo; o que ele não encontra em lugar nenhum é a sua leitura do mundo. Marca com opinião tem alma, e alma vira tribo.","nao_use_quando":"A opinião não é sua de verdade ou foi escolhida só para causar. Opinião fabricada é percebida rápido e destrói a confiança que o formato deveria construir.","como_executar":["Escolha algo que você realmente ama ou odeia e que toca a vida ou o negócio do seu público.","Abra pela posição, em uma frase curta e sem rodeio, antes de qualquer explicação.","Sustente com um motivo vivido: uma cena, um caso ou um número que só você tem.","Feche convocando quem pensa igual, e aceite que quem discorda vai reagir."],"erro_comum":"Ficar em cima do muro para agradar todo mundo. Opinião morna não cria tribo nem cria hater, e sem os dois o conteúdo some.","vizinhos":["React","Falando com a Câmera","Storytelling"],"formatos_catalogo":["Opinião"],"como_pensar":{"intro":"Antes de gravar, responda estas perguntas. Opinião forte nasce do que você ama ou odeia de verdade, não do que parece bom falar.","perguntas":["O que existe no seu mercado que, quando você ouve ou vê, te deixa indignado?","O que você ama tanto fazer no seu trabalho que, se pudesse, faria até de graça?","O que você ama no dia a dia da sua empresa, da sua família ou da sua rotina, e defende sem pensar duas vezes?","Do que você não abre mão na sua vida, no seu trabalho e na sua integridade, mesmo que isso custe cliente ou dinheiro?","Qual crença sua faria muita gente estranhar se você dissesse em público?"],"fecho":"A resposta que mais te dá frio na barriga de falar é a sua melhor opinião. É ela que separa quem vira tribo de quem vira hater, e é isso que constrói uma marca pessoal forte."}}]},{"etapa":"Meio","titulo":"Gerar autoridade","objetivos":[{"objetivo":"Ensinar um conceito","formatos":["Tela Dividida","Quadro Branco","Framework"]},{"objetivo":"Mostrar como você pensa","formatos":["Estudo de caso (análise)","Comparativo"]},{"objetivo":"Organizar a informação","formatos":["Comparativo","Framework","Carrossel Edu"]}],"fichas":[{"nome":"Tela Dividida","familia":"Vídeo","esforco":"Baixo","o_que_e":"A tela fica em duas partes: o material que você está explicando de um lado e você do outro, em geral o material em cima e você embaixo.","use_quando":"Para entender o que você ensina, a pessoa precisa ver e ouvir ao mesmo tempo, como um número, um gráfico ou uma página analisada.","nao_use_quando":"O material não acrescenta nada. Dividir a tela só para preencher espaço diminui você sem ganho nenhum.","como_executar":["Grave a sua parte olhando para a lente, não para o material.","Faça o que aparece na metade de cima acompanhar exatamente o que você está falando.","Mantenha o tamanho das duas partes fixo do início ao fim, para não confundir.","No final, volte para a tela inteira em você e entregue a sua conclusão."],"erro_comum":"Deixar o material fora do tempo da fala. Imagem adiantada ou atrasada cansa em poucos segundos.","vizinhos":["Quadro Branco","Comparativo","Carrossel Edu"],"formatos_catalogo":["Tela Dividida"]},{"nome":"Estudo de caso (análise)","familia":"Vídeo","esforco":"Médio","o_que_e":"Você desmonta um caso real, de outra empresa ou do mercado, e mostra como você interpreta o problema.","use_quando":"O objetivo é provar raciocínio. O que importa não é o resultado do caso, e sim o caminho que você faz para chegar até ele, que é o que o cliente de alto valor compra.","nao_use_quando":"Você sabe pouco sobre o caso. Análise em cima de achismo cai no primeiro comentário de quem conhece o assunto.","como_executar":["Escolha um caso que o público conhece e olhe por um ângulo que ninguém está explorando.","Apresente os fatos antes da opinião, separando com clareza o que é dado do que é interpretação sua.","Mostre as etapas do seu raciocínio, não apenas a resposta final.","Termine tirando um princípio que a pessoa possa aplicar no negócio dela."],"erro_comum":"Narrar o caso e parar. Sem a lição extraída, o vídeo vira notícia e não análise.","vizinhos":["Comparativo","Storytelling","Estudo de caso (cliente real)"],"formatos_catalogo":["Análise"]},{"nome":"Quadro Branco","familia":"Vídeo","esforco":"Médio","o_que_e":"Você explica desenhando ao vivo num quadro, montando a ideia diante de quem assiste.","use_quando":"O conceito tem partes que se conectam, como etapas, relações ou níveis, e fica mais claro sendo construído do que sendo só falado.","nao_use_quando":"A ideia é simples e em linha reta. Desenhar o óbvio só deixa o vídeo arrastado.","como_executar":["Planeje o desenho antes de ligar a câmera, porque improvisar no quadro vira rabisco.","Comece com o quadro limpo: ver a ideia nascendo é o que segura a atenção.","Fale enquanto escreve, nunca escreva primeiro e explique depois.","Termine com o quadro completo em plano fechado, para a pessoa salvar a imagem."],"erro_comum":"Escrever com letra pequena. O conteúdo é visto no celular, e o que não dá para ler na tela pequena não existe.","vizinhos":["Framework","Tela Dividida","Carrossel Edu"],"formatos_catalogo":["Quadro Branco"]},{"nome":"Framework","familia":"Vídeo","esforco":"Médio","o_que_e":"Você batiza o seu próprio método e ensina as etapas dele em ordem.","use_quando":"Você já aplica um processo com os clientes e quer transformá-lo em algo que diferencia a sua mentoria ou consultoria no mercado.","nao_use_quando":"O método é o mesmo de todo mundo com outro nome. Rebatizar o óbvio é percebido rápido e tira credibilidade.","como_executar":["Crie um nome curto e fácil de falar: se o público não repete, não pegou.","Limite de 3 a 5 etapas, porque mais do que isso ninguém guarda.","Deixe o desenho do método visível na tela desde o primeiro segundo.","Mostre o método funcionando num caso concreto dentro do mesmo vídeo."],"erro_comum":"Inventar o método só para ter o que postar. Método que nasceu no roteiro, e não na prática, não aguenta a primeira pergunta difícil.","vizinhos":["Quadro Branco","Carrossel Edu","Estudo de caso (análise)"],"formatos_catalogo":["Framework (método com nome)","Diagrama"]},{"nome":"Comparativo","familia":"Vídeo","esforco":"Médio","o_que_e":"Duas alternativas lado a lado, medidas pela mesma régua, com uma escolha no final.","use_quando":"O seu público está dividido entre caminhos concretos (contratar, fazer sozinho, outro modelo) e ninguém compara com sinceridade.","nao_use_quando":"Você ganha com um dos lados e não vai assumir isso. Comparação puxada para um lado destrói a autoridade assim que alguém percebe.","como_executar":["Diga quais critérios vai usar antes de começar a comparar.","Passe pelos mesmos critérios nos dois lados, na mesma sequência.","Admita pelo menos uma vantagem real da opção que você não vai recomendar.","Termine com a sua escolha e diga em que situação ela mudaria."],"erro_comum":"Comparar e não escolher. A pessoa veio para resolver a dúvida, e um empate não responde nada.","vizinhos":["Ranking ou Tier List","Estudo de caso (análise)","Tela Dividida"],"formatos_catalogo":["Comparação"]},{"nome":"Carrossel Edu","familia":"Estático","esforco":"Médio","o_que_e":"Uma aula em sequência de telas, com capa forte e a ideia avançando passo a passo.","use_quando":"O conteúdo tem etapas e a pessoa precisa ir no ritmo dela, voltando quando quiser.","nao_use_quando":"A ideia cabe numa imagem só. Carrossel esticado à força é abandonado lá pela terceira tela.","como_executar":["Coloque a maior parte da energia na capa, porque é ela que decide se o resto será visto.","Uma ideia por tela, sem exceção.","Amarre as telas: o fim de uma deve dar vontade de ver a próxima.","Feche com uma tela de resumo que valha a pena salvar sozinha."],"erro_comum":"Conteúdo ótimo com capa fraca. Se a primeira tela não interrompe a rolagem, o resto nunca é visto.","vizinhos":["Framework","Quadro Branco","Carrossel Fotos + Texto Nativo"],"formatos_catalogo":["Carrossel educativo"]}]},{"etapa":"Fundo","titulo":"Gerar confiança","objetivos":[{"objetivo":"Derrubar uma objeção","formatos":["Caixinha de Perguntas","Falando com a Câmera"]},{"objetivo":"Mostrar quem você é por dentro","formatos":["Bastidores","No Carro"]},{"objetivo":"Provar resultado","formatos":["Estudo de caso (cliente real)","Carrossel Fotos + Texto Nativo"]}],"fichas":[{"nome":"Caixinha de Perguntas","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você responde uma pergunta enviada por alguém da audiência, com a pergunta aparecendo na tela.","use_quando":"É uma dúvida que surge sempre antes de alguém fechar com você e que você já respondeu muitas vezes nas conversas de venda.","nao_use_quando":"A pergunta é agressiva ou pessoal demais. Responder em público constrange quem mandou e faz os outros pararem de perguntar.","como_executar":["Escolha perguntas que falem por muita gente, não pelo caso de uma pessoa só.","Mantenha a pergunta visível durante o vídeo inteiro.","Responda exatamente o que foi perguntado antes de abrir para o assunto maior.","Feche chamando novas perguntas, porque o formato vive delas."],"erro_comum":"Escolher só perguntas fáceis. A audiência percebe que as difíceis ficam sem resposta e a confiança cai.","vizinhos":["Falando com a Câmera","Estudo de caso (cliente real)","React"],"formatos_catalogo":["Caixinha","Caixa de perguntas"]},{"nome":"Falando com a Câmera","familia":"Vídeo","esforco":"Baixo","o_que_e":"Só você olhando para a lente, sem imagem de apoio e sem efeito. O jeito mais direto de falar com alguém.","use_quando":"O assunto pede a sua presença: assumir uma posição, dar um recado ou quebrar uma objeção que só tem peso se vier de você.","nao_use_quando":"O conteúdo depende de algo para mostrar. Explicação técnica sem apoio visual não para em pé.","como_executar":["Enquadre de meio corpo para perto, com os olhos no terço de cima da tela.","Comece pela afirmação mais forte, nunca por quem você é.","Fale como se fosse com uma pessoa só, não com uma plateia.","Coloque legenda, porque o formato depende de retenção e muita gente assiste sem som."],"erro_comum":"Ler o roteiro. O olhar desviando para o texto apaga justamente a conexão que o formato tem de melhor.","vizinhos":["Caixinha de Perguntas","No Carro","Storytelling"],"formatos_catalogo":["LO-FI","O dono falando"]},{"nome":"Estudo de caso (cliente real)","familia":"Vídeo","esforco":"Médio","o_que_e":"A mesma lógica da análise, mas com um caso seu: cliente real, situação real e resultado real.","use_quando":"O cliente autorizou a exposição e o resultado pode ser conferido.","nao_use_quando":"Faltam números ou falta permissão. Caso sem prova soa como promessa, e promessa na hora da compra aumenta a desconfiança.","como_executar":["Peça autorização por escrito antes de gravar.","Comece pelo ponto de partida: onde o cliente estava e o que estava doendo.","Mostre a decisão que você tomou e o motivo dela, porque é o seu julgamento que se vende, não só o resultado.","Apresente o resultado com número e com o tempo que levou."],"erro_comum":"Contar o caso como se fosse anúncio. O que convence é o raciocínio por trás da decisão; o resultado só confirma.","vizinhos":["Bastidores","Comparativo","Estudo de caso (análise)"],"formatos_catalogo":["Estudo de caso (cliente real)","Depoimento"]},{"nome":"Bastidores","familia":"Vídeo","esforco":"Baixo","o_que_e":"Você abre a porta do processo e mostra como o trabalho acontece antes de o resultado aparecer.","use_quando":"O que te diferencia está no jeito de fazer e esse jeito não aparece de fora, como a preparação de uma sessão ou a análise de um cliente.","nao_use_quando":"O bastidor está bagunçado ou expõe um cliente. Aí a transparência vira risco.","como_executar":["Escolha a parte do processo que o cliente nunca chega a ver.","Grave do jeito que está, sem produzir demais, porque bastidor arrumado perde a verdade.","Diga o que está acontecendo, porque sem explicação é só uma cena bonita.","Ligue o que aparece ao resultado que aquilo gera para o cliente."],"erro_comum":"Mostrar um processo igual ao de todo mundo. Se qualquer concorrente faz igual, você provou que é parecido, não que é melhor.","vizinhos":["No Carro","B-Roll","Falando com a Câmera"],"formatos_catalogo":["Bastidores"]},{"nome":"No Carro","familia":"Vídeo","esforco":"Baixo","o_que_e":"Uma conversa gravada dentro do carro, aproveitando o clima informal e próximo que esse lu function telaLogin(msg = ""){

  $("#b-link").onclick = async () => {
    const email = $("#f-login").email.value.trim();

    if (!sb) return aviso("Sistema em configuração.");
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: voltaLogin() } });
    aviso(error ? "Não consegui enviar o link. Confira o e-mail e tente de novo." : "Pronto. Abra seu e-mail e toque no link para entrar.");
  };
  $("#f-login").onsubmit = async e => { e.preventDefault();
    const email = e.target.email.value.trim(), password = e.target.senha.value;
    if (!sb) return aviso("Sistema em configuração.");
    aviso("Entrando…");
    let { error } = await sb.auth.signInWithPassword({ email, password });
    if (error && password === SENHA_PADRAO && /invalid/i.test(error.message || "")) {
      const { data: ok } = await sb.rpc("im_liberado_email", { e: email });
      if (ok) {
        const cad = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: voltaLogin() } });
        if (cad.error) return aviso("Não consegui criar seu acesso. Use o link de primeiro acesso abaixo.");

        if (error && /confirm/i.test(error.message || "")) return aviso("Confirme seu e-mail pelo link que enviamos e depois entre de novo.");

  };
}

function formatosFiltrados(){
  const f = S.f, q = f.q.toLowerCase();
  return S.formatos.filter(fm => {
    if (f.ht && fm.ht_etapa !== f.ht) return false;
    if (f.tipo && fm.tipo !== f.tipo) return false;
    const ex = S.exemplos.filter(e => e.formato_id === fm.id);
    for (const k of ["funil","etapa"]) if (f[k] && !ex.some(e => e[k] === f[k])) return false;
    if (f.nivel && !ex.some(e => norm(e.nivel) === norm(f.nivel))) return false;
    if (f.angulo && !ex.some(e => e.angulo_grupo === f.angulo)) return false;
    if (q && !(fm.nome + " " + (fm.o_que_e || "") + " " + (fm.quando_usar || "") + " " + ex.map(e => e.gancho || "").join(" ")).toLowerCase().includes(q)) return false;
    return true; });
}
function capa(fm){

function capaEx(e, nome){
  if (!e.miniatura && !e.arquivo) return "";
  const alt = esc(nome);
  if (e.miniatura) return `<div class="capa"><img loading="lazy" alt="${alt}" src="${esc(midia(e.miniatura))}"></div>`;
  if (!ehVideo(e.arquivo)) return `<div class="capa"><img loading="lazy" alt="${alt}" src="${esc(midia(e.arquivo))}"></div>`;
  return `<div class="capa"><video muted playsinline preload="none" aria-label="${alt}" data-src="${esc(midia(e.arquivo))}#t=1"></video><span class="play" aria-hidden="true">▶</span></div>`;
}
let obsCapa = null;
function ligarCapas(root){
  const vs = root.querySelectorAll("video[data-src]"); if (!vs.length) return;
  if (!("IntersectionObserver" in window)) { vs.forEach(v => { v.preload = "metadata"; v.src = v.dataset.src; }); return; }
  obsCapa?.disconnect();
  obsCapa = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return; const v = en.target; v.preload = "metadata"; v.src = v.dataset.src; v.removeAttribute("data-src"); obsCapa.unobserve(v); }), {rootMargin:"200px"});
  vs.forEach(v => obsCapa.observe(v));
}

function abrirTranscricao(e, fm){
  const nome = fm?.nome || "Exemplo", video = ehVideo(e.arquivo) || fm?.tipo === "video", texto = String(e.texto || "").trim();
  const antes = document.activeElement, ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal tx-modal" role="dialog" aria-modal="true" aria-labelledby="tx-tit">
    <div class="modal-head"><h2 id="tx-tit">${video ? "Transcrição" : "Texto do criativo"} · ${esc(nome)}</h2><button class="btn" type="button" data-x="fechar" aria-label="Fechar">✕</button></div>
    <div class="tx-body" tabindex="0">
      ${e.gancho ? `<p><b>Gancho:</b> ${esc(e.gancho)}</p>` : ""}${e.resumo ? `<p class="muted"><b>Resumo:</b> ${esc(e.resumo)}</p>` : ""}

    </div>
    <div class="modal-foot">${texto ? '<button class="btn" type="button" data-x="txt">Baixar .txt</button><button class="btn" type="button" data-x="md">Baixar .md</button><button class="btn" type="button" data-x="copiar">Copiar</button>' : ""}<button class="btn primary" type="button" data-x="fechar">Fechar</button></div></div>`;
  const rolagem = document.body.style.overflow;
  const fechar = () => { ov.remove(); document.body.style.overflow = rolagem; document.removeEventListener("keydown", tecla, true); if (antes && antes.focus) antes.focus(); };
  const focaveis = () => [...ov.querySelectorAll('button,[tabindex="0"]')];
  const tecla = ev => {
    if (ev.key === "Escape") { ev.preventDefault(); return fechar(); }
    if (ev.key !== "Tab") return;
    const f = focaveis(), i = f.indexOf(document.activeElement);
    if (ev.shiftKey && i <= 0) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && (i === -1 || i === f.length - 1)) { ev.preventDefault(); f[0].focus(); } };
  ov.addEventListener("click", async ev => {
    if (ev.target === ov) return fechar();
    const b = ev.target.closest("[data-x]"); if (!b) return;
    if (b.dataset.x === "fechar") return fechar();
    if (b.dataset.x === "txt" || b.dataset.x === "md") return baixarTexto(e, b.dataset.x, fm);
    if (b.dataset.x === "copiar") { try { await navigator.clipboard.writeText(texto); toast("Transcrição copiada."); } catch { toast("Não consegui copiar. Selecione o texto."); } } });

  const listarCur = async () => { const { data, error } = await sb.from("im_curadoria").select("*").order("criado_em", {ascending:false});
    $("#curs").innerHTML = error ? '<p class="muted">Sem permissão de administrador.</p>' : (data.length ? data.map(c => `<div class="row"><span class="mono muted">${esc(c.email || c.user_id)} · ${new Date(c.criado_em).toLocaleDateString("pt-BR")} · ${esc(c.status)}</span><p>${esc(c.descricao)}</p><a href="${esc(linkSeguro(c.arquivo))}" target="_blank" rel="noopener">${esc(c.arquivo)}</a><div class="note-box"><textarea aria-label="Resposta" data-resp="${c.id}">${esc(c.resposta || "")}</textarea><button class="btn primary" data-r="${c.id}" style="justify-self:start">Responder</button></div></div>`).join("") : '<div class="empty">Nenhum envio.</div>'); };
  $("#f-ac").onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target);
    const { error } = await sb.from("im_acessos").upsert({ email: fd.get("email").trim().toLowerCase(), nome: fd.get("nome") || null, valido_ate: fd.get("valido_ate") || null, ativo: true });
    if (error) return toast("Não consegui liberar."); e.target.reset(); toast("Acesso liberado."); listarAc(); };
  m.addEventListener("click", async e => { const t = e.target.closest("[data-tg]"); const r = e.target.closest("button[data-r]");
    if (t) { const { error } = await sb.from("im_acessos").update({ ativo: t.dataset.on !== "true" }).eq("email", t.dataset.tg); if (error) return toast("Não consegui mudar."); listarAc(); }
    if (r) { const txt = m.querySelector(`[data-resp="${r.dataset.r}"]`).value; const { error } = await sb.from("im_curadoria").update({ resposta: txt, status: "respondido" }).eq("id", r.dataset.r); if (error) return toast("Não consegui responder."); toast("Resposta enviada."); listarCur(); } });
  m.addEventListener("change", async e => { const i = e.target.closest("[data-val]"); if (!i) return; const { error } = await sb.from("im_acessos").update({ valido_ate: i.value || null }).eq("email", i.dataset.val); toast(error ? "Não consegui salvar." : "Validade salva."); });
  const fT = $("#f-tut");
  const limparTut = () => { fT.reset(); fT.id.value = ""; $("#tut-salvar").textContent = "Adicionar tutorial"; $("#tut-cancelar").hidden = true; };
  const listarTut = async () => { const { data, error } = await sb.from("im_tutoriais").select("*").order("ordem").order("id");
    if (error) { $("#tuts").innerHTML = '<p class="muted">Não consegui carregar os tutoriais. Rode o 004-tutoriais.sql no banco.</p>'; return; }
    S.tutoriais = data || []; const c = $("#c-tut"); if (c) c.textContent = S.tutoriais.length;
    $("#tuts").innerHTML = S.tutoriais.length ? `<table class="adm"><tr><th>Ordem</th><th>Título</th><th>Categoria</th><th></th></tr>${S.tutoriais.map(t => `<tr><td>${esc(t.ordem)}</td><td>${esc(t.titulo)}</td><td>${esc(t.categoria)}</td><td><div class="actions"><button class="btn" type="button" data-tut-ed="${t.id}">Editar</button><button class="btn" type="button" data-tut-del="${t.id}">Apagar</button></div></td></tr>`).join("")}</table>` : '<p class="muted">Nenhum tutorial ainda.</p>'; };
  fT.onsubmit = async e => { e.preventDefault(); const fd = new FormData(fT), id = fd.get("id");
    const reg = { titulo: fd.get("titulo").trim(), categoria: fd.get("categoria"), video_url: fd.get("video_url").trim(), descricao: fd.get("descricao").trim() || null, ordem: parseInt(fd.get("ordem"), 10) || 0 };
    const { error } = id ? await sb.from("im_tutoriais").update(reg).eq("id", id) : await sb.from("im_tutoriais").insert(reg);
    if (error) return toast("Não consegui salvar o tutorial."); toast(id ? "Tutorial atualizado." : "Tutorial adicionado."); limparTut(); listarTut(); };
  $("#tut-cancelar").onclick = limparTut;
  m.addEventListener("click", async e => { const ed = e.target.closest("[data-tut-ed]"), del = e.target.closest("[data-tut-del]");
    if (ed) { const t = S.tutoriais.find(x => String(x.id) === ed.dataset.tutEd); if (!t) return;
      fT.id.value = t.id; fT.titulo.value = t.titulo || ""; fT.categoria.value = t.categoria || "Geral"; fT.video_url.value = t.video_url || ""; fT.descricao.value = t.descricao || ""; fT.ordem.value = t.ordem ?? 0;
      $("#tut-salvar").textContent = "Salvar alterações"; $("#tut-cancelar").hidden = false; fT.titulo.focus(); }
    if (del) { if (!confirm("Apagar este tutorial?")) return; const { error } = await sb.from("im_tutoriais").delete().eq("id", del.dataset.tutDel); if (error) return toast("Não consegui apagar."); toast("Tutorial apagado."); listarTut(); } });
  listarAc(); listarCur(); listarTut();
}

/* ---------- partida ---------- */
let iniciado = false;
async function iniciar(){
  if (!sb) return telaLogin("Sistema em configuração: falta a chave pública do banco.");
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  if (session.user.user_metadata?.senha_trocada !== true) return telaSenha(true);
  if (iniciado) return; iniciado = true;
  S.user = session.user;
  S.admin = !!(await sb.rpc("im_admin")).data;
  const { data: liberado } = await sb.rpc("im_liberado");
  if (!liberado && !S.admin) return telaSemAcesso();
  await carregar(); casca(); rota();
  addEventListener("hashchange", rota);
}
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN") setTimeout(iniciar, 0); });
iniciar();
</script>
