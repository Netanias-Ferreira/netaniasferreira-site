/* ================== rota (regra nova do Netanias, 19/11/2026; o banco recalcula igual) ================== */
function calcularRota(r) {
  const t5 = Array.isArray(r.t5) ? r.t5 : [];
  const anuncia = t5.includes("A");                        // anuncia = Tela 5 com A
  const ABC = ["A", "B", "C"].includes(r.t6);
  const verm = [], ama = [];
  if (r.t1 === "D" || r.t1 === "E") verm.push("tela1=" + r.t1);
  if (ABC && !anuncia) verm.push("tela6=" + r.t6 + "+sem_anuncio_tela5");
  if (r.t2 === "A") ama.push("tela2=A");
  if (ABC && anuncia) ama.push("tela6=" + r.t6 + "+anuncia_tela5");
  let rota, gatilhos;
  if (verm.length) { rota = "vermelho"; gatilhos = verm; }
  else if (ama.length) { rota = "amarelo"; gatilhos = ama; }
  else { rota = "verde"; gatilhos = ["sem_gatilho_vermelho_ou_amarelo"]; }
  const pede_socio = ["B", "C", "D"].includes(r.t7);    // decide junto com outra pessoa
  if (pede_socio) gatilhos = gatilhos.concat("tela7=" + r.t7 + "+pede_socio");
  // Prioridade entre VERDES (máximo 8)
  let p = 0;
  p += ({ B: 1, C: 2, D: 3 })[r.t2] || 0;                // Tela 2
  p += ({ D: 1, E: 2, F: 3 })[r.t6] || 0;                // Tela 6
  if (["A", "B", "D"].includes(r.t8)) p += 1;            // Tela 8 = A, B ou D
  if (r.t4 === "D" || r.t4 === "E") p += 1;              // Tela 4 = D ou E
  return { rota, gatilhos, pede_socio, pontuacao: p, anuncia };
}

    const sel = multi ? (S.r[chave] || []) : [S.r[chave]];
    corpo = `<ul class="opcoes" role="${multi ? "group" : "radiogroup"}" aria-labelledby="q${t.id}"${t.sub ? ` aria-describedby="s${t.id}"` : ""}>` +
      t.opcoes.map((o, k) => `<li><button type="button" class="op" role="${multi ? "checkbox" : "radio"}" aria-checked="${sel.includes(LETRAS[k])}" data-letra="${LETRAS[k]}"><span class="letra" aria-hidden="true">${LETRAS[k]}</span><span>${esc(o)}</span></button></li>`).join("") +
      `</ul><p class="dica">Digite a letra ou clique na opção</p>` +
      (multi ? `<div class="acoes"><button type="button" class="btn" id="continuar"${sel.length ? "" : " disabled"}>Continuar</button></div>` : "");
  } else {
    const c = S.c, L = t.campos;
    corpo = `<div class="apoio">${t.apoio.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      <form id="form" novalidate>
        <div class="hp" aria-hidden="true"><label for="empresa_site">Não preencha</label><input id="empresa_site" name="empresa_site" tabindex="-1" autocomplete="off"></div>
        ${campo("nome", L.nome, "text", c.nome, 'autocomplete="name" maxlength="120" required')}
        ${campo("whatsapp", L.whatsapp, "tel", c.whatsapp, 'autocomplete="tel-national" inputmode="tel" placeholder="(85) 99999-8888" maxlength="16" required')}
        ${campo("email", L.email, "email", c.email, 'autocomplete="email" inputmode="email" spellcheck="false" maxlength="160" required')}
        ${campo("instagram", L.instagram, "text", c.instagram, 'autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="60" placeholder="@seuperfil"')}
        <button type="submit" class="btn largo" id="enviar">Enviar respostas</button>
        <div class="alerta" id="alerta" role="alert" hidden>
          <p><b>Não consegui enviar as suas respostas.</b> Elas continuam guardadas neste aparelho. Confira a internet e tente de novo.</p>
          <button type="button" class="btn" id="tentar">Tentar de novo</button>
        </div>
      </form>`;
  }
  montar(`<section class="tela" aria-labelledby="q${t.id}">${cab}${corpo}</section>`, `Pergunta ${i + 1} de ${TOTAL}`);
  ligar(t);
}

function campo(id, label, type, val, extra) {
  return `<div class="campo"><label for="f_${id}">${esc(label)}</label><input id="f_${id}" name="${id}" type="${type}" value="${esc(val)}" ${extra} aria-describedby="e_${id}"><p class="erro-campo" id="e_${id}" aria-live="polite"></p></div>`;
}

function ir(n) { S.passo = n; salvar(); render(); }

function ligar(t) {
  const chave = "t" + t.id;
  if (t.tipo === "unica") {
    palco.querySelectorAll(".op").forEach((b) => b.addEventListener("click", () => escolher(t, b.dataset.letra)));
  } else if (t.tipo === "multipla") {
    palco.querySelectorAll(".op").forEach((b) => b.addEventListener("click", () => alternar(t, b.dataset.letra)));
    $("#continuar").addEventListener("click", () => { if ((S.r[chave] || []).length) ir(S.passo + 1); });
  } else {
    const f = $("#form");
    const zap = $("#f_whatsapp");
    zap.addEventListener("input", () => { const pos = zap.value.length; zap.value = mascaraZap(zap.value); if (pos !== zap.value.length) zap.setSelectionRange(zap.value.length, zap.value.length); });
    ["nome", "whatsapp", "email", "instagram"].forEach((k) => $("#f_" + k).addEventListener("input", (e) => { S.c[k] = e.target.value; salvar(); erro(k, ""); }));
    f.addEventListener("submit", (e) => { e.preventDefault(); enviar(); });
    $("#tentar").addEventListener("click", enviar);
  }
}

function escolher(t, letra) {
  if (avancando) return;
  S.r["t" + t.id] = letra; salvar();
  palco.querySelectorAll(".op").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.letra === letra)));
  avancando = true;
  setTimeout(() => { avancando = false; ir(S.passo + 1); }, reduzido() ? 120 : 320);
}
function alternar(t, letra) {
  const k = "t" + t.id, cur = new Set(S.r[k] || []);
  cur.has(letra) ? cur.delete(letra) : cur.add(letra);
  S.r[k] = LETRAS.split("").filter((l) => cur.has(l)); salvar();
  palco.querySelectorAll(".op").forEach((b) => b.setAttribute("aria-checked", String(cur.has(b.dataset.letra))));
  $("#continuar").disabled = !S.r[k].length;
}

btnVoltar.addEventListener("click", () => { if (S.passo > 0 && !S.enviado) ir(S.passo - 1); });

document.addEventListener("keydown", (e) => {
  if (S.enviado || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const t = TELAS[S.passo];
  if (!t || (t.tipo !== "unica" && t.tipo !== "multipla")) return;
  const L = e.key.length === 1 ? e.key.toUpperCase() : "";
  const k = LETRAS.indexOf(L);
  if (L && k > -1 && k < t.opcoes.length) { e.preventDefault(); t.tipo === "unica" ? escolher(t, L) : alternar(t, L); return; }
  if (e.key === "Enter" && t.tipo === "multipla" && (S.r["t" + t.id] || []).length && tag !== "button") { e.preventDefault(); ir(S.passo + 1); }
});

/* ================== envio ================== */
function erro(k, msg) { const p = $("#e_" + k), i = $("#f_" + k); if (p) p.textContent = msg; if (i) i.setAttribute("aria-invalid", msg ? "true" : "false"); }

function validarContato() {
  const c = S.c; let primeiro = null;
  const marca = (k, m) => { erro(k, m); if (m && !primeiro) primeiro = k; };
  const nome = c.nome.trim();
  marca("nome", nome.length < 2 ? "Escreva o seu nome." : "");
  marca("whatsapp", !zapValido(c.whatsapp) ? "Confira o WhatsApp: DDD + número, ex.: (85) 99999-8888." : "");
  marca("email", !emailValido(c.email) ? "Confira o e-mail, ex.: nome@empresa.com." : "");
  marca("instagram", !instaValido(normInsta(c.instagram)) ? "Use só o @ do perfil, ex.: @seuperfil." : "");
  if (primeiro) $("#f_" + primeiro).focus();
  return !primeiro;
}

function legiveis(r) {
  const out = {};
  TELAS.filter((t) => t.tipo === "unica" || t.tipo === "multipla").forEach((t) => {
    const key = "Tela " + String(t.id).padStart(2, "0");
    let resp = "";
    if (t.tipo === "unica") resp = r["t" + t.id] ? `${r["t" + t.id]}) ${t.opcoes[LETRAS.indexOf(r["t" + t.id])]}` : "";
    else resp = (r["t" + t.id] || []).map((l) => `${l}) ${t.opcoes[LETRAS.indexOf(l)]}`).join(" / ");
    out[key] = `${t.pergunta} → ${resp}`;
  });
  return out;
}

function montarPayload() {
  const r = S.r, rt = calcularRota(r);
  const utm = {}; UTM_KEYS.slice(0, 5).forEach((k) => (utm[k] = ss.get("ap3_" + k) || ""));
  return {
    versao: 1,
    formulario: "aplicacao-3",
    envio_id: S.envio_id,
    nome: S.c.nome.trim(),
    whatsapp: "55" + zapLocal(S.c.whatsapp),
    email: S.c.email.trim().toLowerCase(),
    instagram: normInsta(S.c.instagram),
    link_anuncio: "",
    rota: rt.rota,
    pede_socio: rt.pede_socio,
    gatilhos: rt.gatilhos,
    pontuacao: rt.pontuacao,
    respostas: { tela1: r.t1, tela2: r.t2, tela3: r.t3, tela4: r.t4, tela5: r.t5 || [], tela6: r.t6, tela7: r.t7, tela8: r.t8 },
    respostas_legiveis: legiveis(r),
    utm,
    fbclid: ss.get("ap3_fbclid") || "",
    url_origem: ss.get("ap3_url_origem") || "",
    referrer: ss.get("ap3_referrer") || "",
    enviado_em: new Date().toISOString(),
    hp: ($("#empresa_site") && $("#empresa_site").value) || ""
  };
}

/* mesmas regras da função do banco: o modo teste reprova o que o banco reprovaria */
function validarPayload(p) {
  const e = [];
  const um = (x, n) => typeof x === "string" && new RegExp(`^[A-${LETRAS[n - 1]}]$`).test(x);
  const rr = p.respostas || {};
  if (!um(rr.tela1, 5)) e.push("tela1"); if (!um(rr.tela2, 4)) e.push("tela2"); if (!um(rr.tela3, 6)) e.push("tela3");
  if (!um(rr.tela4, 5)) e.push("tela4"); if (!Array.isArray(rr.tela5) || !rr.tela5.length || rr.tela5.length > 6 || rr.tela5.some((x) => !um(x, 6))) e.push("tela5");
  if (!um(rr.tela6, 6)) e.push("tela6"); if (!um(rr.tela7, 6)) e.push("tela7"); if (!um(rr.tela8, 4)) e.push("tela8");
  if (!p.nome || p.nome.length < 2 || p.nome.length > 120) e.push("nome");
  if (!/^55[1-9][1-9]\d{8,9}$/.test(p.whatsapp)) e.push("whatsapp");
  if (!emailValido(p.email)) e.push("email");
  if (!instaValido(p.instagram)) e.push("instagram");
  if (!/^[A-Za-z0-9-]{8,64}$/.test(p.envio_id)) e.push("envio_id");
  if (!["verde", "amarelo", "vermelho"].includes(p.rota)) e.push("rota");
  const recalculo = calcularRota({ t1: rr.tela1, t2: rr.tela2, t4: rr.tela4, t5: rr.tela5, t6: rr.tela6, t7: rr.tela7, t8: rr.tela8 });
  if (recalculo.rota !== p.rota) e.push("rota_diverge");
  if (JSON.stringify(p).length > 40000) e.push("tamanho");
  return e;
}

async function gravar(p) {
  if (MOCK) {
    await new Promise((ok) => setTimeout(ok, 700));
    if (MOCK_ERRO) throw new Error("mock: falha simulada");
    const e = validarPayload(p);
    if (e.length) throw new Error("mock: payload reprovado: " + e.join(", "));
    window.__ap3_payload = p;
    console.info("[AP3 mock] payload válido", p);
    return { ok: true, rota: p.rota };
  }
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
  try {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${CONFIG.RPC}`, {
      method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_CHAVE_PUBLICA },
      body: JSON.stringify({ payload: p })
    });
    const j = await res.json().catch(() => null);
    if (!res.ok || !j || j.ok !== true) throw new Error("falha " + res.status);
    return j;
  } finally { clearTimeout(tm); }
}

function pendentes() { try { return JSON.parse(ls.get(K_PEND) || "[]"); } catch (e) { return []; } }
function guardarPendente(p) { const l = pendentes().filter((x) => x.envio_id !== p.envio_id); l.push(p); ls.set(K_PEND, JSON.stringify(l.slice(-5))); }
function tirarPendente(id) { ls.set(K_PEND, JSON.stringify(pendentes().filter((x) => x.envio_id !== id))); }

async function enviar() {
  if (S.enviando || S.enviado) return;
  if (!validarContato()) return;
  const btn = $("#enviar"), tentar = $("#tentar"), alerta = $("#alerta");
  S.enviando = true;
  const p = montarPayload();
  btn.disabled = true; if (tentar) tentar.disabled = true;
  btn.innerHTML = `<span class="giro" aria-hidden="true"></span> Enviando…`;
  anuncio.textContent = "Enviando…";
  alerta.hidden = true;
  try {
    const r = await gravar(p);
    tirarPendente(p.envio_id);
    S.enviado = true; S.rota = r.rota || p.rota; S.final = { rota: S.rota, mock: MOCK ? p : null };
    delete S.enviando; salvar();
    renderFinal();
  } catch (err) {
    console.warn("[AP3] envio falhou", err);
    if (!MOCK) guardarPendente(p);
    delete S.enviando;
    btn.disabled = false; if (tentar) tentar.disabled = false;
    btn.textContent = "Enviar respostas";
    alerta.hidden = false;
    anuncio.textContent = "Não consegui enviar as suas respostas.";
    $("#tentar").focus();
  }
}

/* re-tenta envios que ficaram presos numa visita anterior (o banco ignora repetido pelo envio_id) */
function retentarPendentes() {
  if (MOCK) return;
  pendentes().forEach((p) => {
    if (p.envio_id === S.envio_id && !S.enviado) return;   // este mesmo envio está aberto na tela: a pessoa reenvia
    gravar(p).then(() => tirarPendente(p.envio_id)).catch(() => {});
  });
}

/* ================== tela final única (Tela 11 neutra, Variante 2) ==================
   Igual para todas as rotas. A rota só vai para o CRM (triagem interna). */
function renderFinal() {
  topo(TOTAL);
  const titulo = "Recebido. Agora eu leio.";
  const texto = [
    "Em até 1 hora útil (segunda a sexta, das 9h às 18h) chega no seu WhatsApp o próximo passo que faz sentido pra você.",
    "Às vezes é uma call comigo. Às vezes é um passo antes dela. Você vai saber qual, e por quê.",
    `Salva o número <b>${esc(CONFIG.WHATSAPP_NETANIAS_EXIBIDO)}</b> pra mensagem não afundar no meio dos grupos.`
  ];
  const botao = `<a class="btn largo" href="https://wa.me/${esc(digitos(CONFIG.WHATSAPP_NETANIAS))}" target="_blank" rel="noopener">Abrir o WhatsApp</a>`;
  const mock = S.final.mock ? `<details class="mock-saida" open><summary>Payload enviado (modo teste, não aparece na página real)</summary><pre>${esc(JSON.stringify(S.final.mock, null, 2))}</pre></details>` : "";
  montar(`<section class="tela final" aria-labelledby="qf"><h1 id="qf">${titulo}</h1><div class="texto">${texto.map((p) => `<p>${p}</p>`).join("")}</div>${botao}${mock}</section>`, titulo);
}

if (MOCK) document.body.insertAdjacentHTML("beforeend", `<span class="mock">MODO TESTE${MOCK_ERRO ? ": ERRO" : ""}</span>`);

/* ================== modo embed: conversa com a LP (só altura, tela e pedidos de foco/fechar; nenhum dado pessoal) ================== */
function avisarAltura() {
  if (!EMBED || window.parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  window.parent.postMessage({ tipo: "ap3-altura", h, passo: S.enviado ? "final" : S.passo }, "*");
}
if (EMBED) {
  new MutationObserver(() => requestAnimationFrame(avisarAltura)).observe(palco, { childList: true });
  if (window.ResizeObserver) new ResizeObserver(() => avisarAltura()).observe(document.body);
  window.addEventListener("resize", avisarAltura);
  window.addEventListener("load", avisarAltura);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(avisarAltura);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") window.parent.postMessage({ tipo: "ap3-esc" }, "*"); });
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent || !e.data || e.data.tipo !== "ap3-foco") return;
    const alvo = $("h1", palco); if (alvo) alvo.focus({ preventScroll: true });
  });
}

window.__AP3 = { TELAS, calcularRota, validarPayload, montarPayload, estado: () => S };
render();
retentarPendentes();
avisarAltura();
</script>
